  pointer-events: none;
}

.form-switch .form-check-input:disabled,

  left: 0;

  height: 16px;

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

}

.form-switch .form-check-input:focus-visible {

.form-range {
  appearance: none;
  display: block;

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

  [aria-selected=&quot;true&quot;],

}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {

#widget &gt; svg {

svg.lucide {

.text-warning,

      function setupAutoHideNavigation(nav) {
        const scrollingElement = document.scrollingElement || document.documentElement;
        const scrollPosition = () =&gt; Math.max(0, Math.min(window.scrollY, Math.max(0, scrollingElement.scrollHeight - window.innerHeight)));
        let previousY = scrollPosition();
        let direction = 0;
        let distance = 0;
        let framePending = false;

        function reveal() {
          nav.classList.remove(&#x27;is-scroll-hidden&#x27;);
          previousY = scrollPosition();
          direction = 0;
          distance = 0;
        }

        function update() {
          framePending = false;
          const currentY = scrollPosition();
          const delta = currentY - previousY;
          previousY = currentY;
          // Keep the top of the page and keyboard navigation accessible.
          if (currentY &lt;= nav.offsetHeight || nav.querySelector(&#x27;:focus-visible&#x27;)) {
            reveal();
            return;
          }
          if (delta === 0) return;
          const nextDirection = Math.sign(delta);
          if (nextDirection !== direction) distance = 0;
          direction = nextDirection;
          distance += Math.abs(delta);
          // Reading down hides after 24px; returning up reveals after 12px.
          if (distance &gt;= (direction &gt; 0 ? 24 : 12)) {
            nav.classList.toggle(&#x27;is-scroll-hidden&#x27;, direction &gt; 0);
            distance = 0;
          }

          if (framePending) return;
          framePending = true;
          window.requestAnimationFrame(update);
        }, { passive: true });
        window.addEventListener(&#x27;resize&#x27;, reveal);
        nav.addEventListener(&#x27;focusin&#x27;, reveal);
        return reveal;

      const teacherExpandedSummaries = {
        &#x27;曾勇&#x27;: &#x27;曾勇长期在电子科技大学从事管理科学与金融工程研究，教育背景横跨自动化、系统工程与管理科学，曾任经济与管理学院院长、电子科技大学副校长和校长。其研究覆盖公司财务与资本市场、金融投资与金融工程、技术创新投资与定价，强调数量方法在投资和创新决策中的应用。学校资料与已核对的百度百科词条还列有其论文、学术著作、科研奖励及国际欧亚科学院院士等公开履历。&#x27;,
        &#x27;陈磊&#x27;: &#x27;陈磊的公开研究方向集中在证券期货投资、金融计量经济学和量化交易，兼具金融理论、统计建模与交易实验三个层面。学院2025年量化交易教学报道介绍了其课程建设、交易策略验证和实验教学框架，说明其公开教学活动与数据驱动的投资研究联系较紧。现有学院页面能够支持研究和教学方向判断，但暂未公开足够信息用于推断具体授课风格或考核难度。&#x27;,
        &#x27;陈林&#x27;: &#x27;陈林主要研究信用风险评价与管理、互联网金融和固定收益证券，研究主题连接商业银行风险、债券市场与金融科技。研究生院页面列有相关科研项目、论文和教材成果；其公开合作成果还涉及互联网金融的发展、监管及中小企业贷款技术。对于债券、银行风控或金融科技方向，这些研究线索比单纯的职称信息更有参考价值。&#x27;,
        &#x27;邓光军&#x27;: &#x27;邓光军的公开方向包括金融工程、金融投资、新兴技术管理与技术创新，研究中可见实物期权方法的应用。实物期权强调在不确定性下对投资时机和管理弹性进行估值，因此其研究与科技项目投资、创新决策及公司金融存在交叉。学院资料目前主要提供研究方向和代表性论文线索，尚不足以判断具体课程安排。&#x27;,
        &#x27;丁亚&#x27;: &#x27;丁亚具有农业经济学训练背景，研究从传统农业与农村发展延伸到老龄经济、长期照护、养老政策和可持续农业技术。公开项目与成果体现出较强的政策评估和应用经济学取向，关注人口结构、公共服务与农村经济行为。其方向与纯金融课程的直接关联较弱，但适合对公共政策、发展经济和实证评估感兴趣的同学了解。&#x27;,
        &#x27;鞠晴江&#x27;: &#x27;鞠晴江主要关注产业经济与产业政策、区域可持续发展及创新合作，研究对象通常处于产业、区域和公共政策的交叉处。导师资料中的科研项目体现出应用经济分析特点，强调政策环境、区域发展和合作创新机制。若计划选择产业经济、数字经济或政策研究方向，这些主题可作为判断研究匹配度的线索。&#x27;,
        &#x27;李平&#x27;: &#x27;李平具有数学、应用数学和金融相关的交叉训练，并有瑞士弗里堡大学访问经历，现为教授、博士生导师。其研究从金融市场微观结构延伸到量化交易、高频数据、风险投资、互联网金融、金融科技与碳金融，既关注市场机制，也重视数据分析和现实监管问题。公开页面还列有专著、科研项目、教学成果奖和金融科技人才培养项目，与当前“金融科技导论”的课程定位有直接联系。&#x27;,

            &#x27;其代表性研究大量使用实物期权处理不确定环境下的投资时机、技术进入和管理弹性问题，具体包括R&amp;D投资、新兴技术企业估值、模块创新、银行战略合作及连续创新决策；所授课程包括金融衍生工具、金融工程学和金融建模。[[1]]&#x27;,
            &#x27;该研究背景适合科技金融、公司投资和创新决策方向，但官方教师页的项目最新止于2012年、论文列表最新止于2013年。此次检索未发现能够由电子科大官方页面确认的近三年新闻，因此摘要明确保留这一资料时点。[[1]]&#x27;
          ],
          sources: [
            { label: &#x27;邓光军｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;邓光军&#x27;].url, summary: &#x27;核对教育经历、金融工程与技术创新方向、课程、论文和项目。&#x27;, latest: &#x27;项目最新止于2012年，论文清单最新止于2013年。&#x27; },
            { label: &#x27;经济与管理学院金融方向师资名单&#x27;, url: financeFacultyUrl, summary: &#x27;用于确认其仍列于金融方向师资及研究领域。&#x27;, latest: &#x27;截至2026年本次检索仍列入金融方向师资；该名单不反映论文或项目年份。&#x27; }
          ]
        },
        &#x27;丁亚&#x27;: {
          paragraphs: [
            &#x27;丁亚本科毕业于中国人民大学国际经济学专业，在美国堪萨斯州立大学取得农业经济学博士，后于内布拉斯加大学国家干旱减灾中心从事博士后研究。官方页面未披露籍贯。学院旧页与研究生院现行页对职称表述不一致，本页以研究生院当前显示的“副教授”作为时点更近的依据。[[1]][[2]]&#x27;,
            &#x27;其研究从农村发展、主观福利和可持续农业技术扩展到老龄经济、养老保障和长期照护政策，讲授过宏观经济学、微观经济学和商务统计。论文涉及农村养老保险、老年生活满意度、农业合作组织与保护性耕作。[[1]][[2]]&#x27;,
            &#x27;近年最明确的动向是主持2023—2026年国家社会科学基金一般项目“推进长期护理保险政策背景下长期照护的市场供需关系研究”。这说明其当前研究重心已明显延伸到长期护理保险与照护市场，而学院旧页的成果清单主要止于2016年。[[2]]&#x27;
          ],
          sources: [
            { label: &#x27;丁亚｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;丁亚&#x27;].url, summary: &#x27;核对教育经历、农村发展与农业政策方向、课程和较早论文。该页职称表述与研究生院现行页存在差异。&#x27;, latest: &#x27;论文和项目内容主要止于2016—2017年。&#x27; },
            { label: &#x27;丁亚｜研究生院导师档案&#x27;, url: advisorUrl(11201), summary: &#x27;核对当前导师身份、老龄经济方向及长期护理保险项目。&#x27;, latest: &#x27;最新列示项目周期为2023—2026年。&#x27; }
          ]
        },
        &#x27;鞠晴江&#x27;: {
          paragraphs: [
            &#x27;鞠晴江在四川大学完成投资经济、区域经济学和政治经济学学位训练，并先后赴美国内布拉斯加大学奥马哈分校、威廉玛丽学院访学。官方页面未披露籍贯。其长期方向包括产业经济与产业政策、区域可持续发展、科技创新合作和社会影响力投资。[[1]][[2]]&#x27;,
            &#x27;近年项目脉络较清晰：2022—2023年研究四川与以色列“两国双园”科技创新合作，2023—2024年研究成渝汽车产业集群竞争力，2024—2025年研究四川新能源汽车动力电池回收市场机制与政策优化。[[2]]&#x27;,
            &#x27;其代表论文包括新能源汽车补贴政策与保有量、基础设施与包容性增长、农户土地征收与劳动力配置等，招生方向覆盖产业经济学和数字经济学。相较于纯金融市场研究，其工作更偏产业政策、区域治理与现实政策评估。[[2]]&#x27;
          ],
          sources: [
            { label: &#x27;鞠晴江｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;鞠晴江&#x27;].url, summary: &#x27;核对教育与访问经历、产业经济和区域研究方向。&#x27;, latest: &#x27;截至2026年本次检索仍展示其教师身份与研究方向；近期项目时间以导师档案为准。&#x27; },
            { label: &#x27;鞠晴江｜研究生院导师档案&#x27;, url: advisorUrl(11691), summary: &#x27;核对2022—2025年项目、代表论文、学术兼职和招生方向。&#x27;, latest: &#x27;最新列示项目周期止于2025年。&#x27; }
          ]
        },
        &#x27;李平&#x27;: {
          paragraphs: [
            &#x27;李平本科接受数学教育训练，后在电子科技大学取得应用数学硕士和管理科学与工程博士学位，并曾赴瑞士弗里堡大学访学。官方页面未披露籍贯。其研究从金融市场微观结构、高频交易延伸至企业投融资、金融科技、量化交易和碳金融。[[1]][[2]][[3]]&#x27;,
            &#x27;研究生院与2025年研究院介绍显示，他主持国家自然科学基金、教育部后期资助、深交所和上期所委托项目等10余项，已发表论文80余篇、出版专著5部；同时担任多项金融与金融科技学术、教学和智库职务。[[2]][[3]]&#x27;,
            &#x27;教学方面，他是金融学国家一流本科专业建设点负责人，主持新文科项目并获得国家级教学成果奖。当前一年方案中与李强共同承担《金融科技导论》；其研究背景有助于把市场机制、量化数据、监管与企业融资联系起来。最新综合人物介绍发布于2025年，但没有逐篇列出2025年的新论文题目。[[1]][[3]]&#x27;
          ],
          sources: [
            { label: &#x27;李平｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;李平&#x27;].url, summary: &#x27;核对教育背景、市场微观结构与金融科技方向及所授课程。&#x27;, latest: &#x27;截至2026年本次检索仍展示其教师身份、研究方向与课程；成果部分仅给累计概况。&#x27; },
            { label: &#x27;李平｜研究生院导师档案&#x27;, url: advisorUrl(10536), summary: &#x27;核对导师身份、招生方向、项目和成果数量。&#x27;, latest: &#x27;截至2026年本次检索仍展示其导师身份与招生方向；项目和论文未逐项列年。&#x27; },
            { label: &#x27;李平教授｜人文社科高研院&#x27;, url: &#x27;https://aihss.uestc.edu.cn/info/1095/1246.htm&#x27;, summary: &#x27;补充碳金融、量化交易、金融科技、教学成果和当前学术兼职。&#x27;, latest: &#x27;发布于2025年6月9日。&#x27; }
          ]
        },
        &#x27;李强&#x27;: {
          paragraphs: [
            &#x27;李强在电子科技大学完成工商管理本科和管理科学与工程金融工程方向博士学习，曾赴美国路易斯安那州立大学金融系访学。官方页面未披露籍贯。其研究覆盖金融工程、商业银行与金融科技、公司金融与资本市场、风险投资和科技金融。[[1]][[2]]&#x27;,
            &#x27;公开项目包括金融科技背景下商业银行零售信贷产品创新、市场竞争与模式选择，银行业数字化转型效果评价，以及增长期权、创业企业定价和风险投资决策。其成果发表于China Economic Review、《管理科学学报》《中国管理科学》《会计研究》等，金融学基础课程曾获国家精品在线开放课程和国家级一流本科课程。[[2]]&#x27;,
            &#x27;教学覆盖金融学基础、金融工程、互联网金融和金融市场等层次，当前与李平共同承担《金融科技导论》。EMBA师资页在2023年仍列其为项目师资；但研究生院项目清单未逐项给出年份，因此不能仅据页面顺序判断哪些项目属于2024—2026年。[[1]][[3]]&#x27;
          ],
          sources: [
            { label: &#x27;李强｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;李强&#x27;].url, summary: &#x27;核对教育经历、研究方向、课程和学院身份，并排除通信学院同名教师。&#x27;, latest: &#x27;截至2026年本次检索仍展示其教师身份、研究方向与课程。&#x27; },
            { label: &#x27;李强｜研究生院导师档案&#x27;, url: advisorUrl(10928), summary: &#x27;核对金融科技、银行数字化、公司金融项目与教学成果。&#x27;, latest: &#x27;截至2026年本次检索仍展示其导师身份、招生方向及项目概况。&#x27; },
            { label: &#x27;李强｜电子科技大学EMBA师资页&#x27;, url: &#x27;https://www.emba.uestc.edu.cn/show.jsp?urltype=news.NewsContentUrl&amp;wbtreeid=1013&amp;wbnewsid=1210&#x27;, summary: &#x27;用于交叉确认经管学院本人及项目教学身份。&#x27;, latest: &#x27;页面更新日期为2023年9月26日。&#x27; }
          ]
        },
        &#x27;李睿&#x27;: {
          paragraphs: [
            &#x27;李睿本科毕业于西南财经大学，在北京大学取得经济学博士学位，2019年进入电子科技大学，2022年晋升副教授。官方页面未披露籍贯。其研究集中于家庭金融、创业创新、国际金融和金融衍生品。[[1]][[2]]&#x27;,
            &#x27;她讲授国际金融、金融衍生工具等课程，主持国家自然科学基金青年项目，公开成果发表于Journal of Empirical Finance、The European Journal of Finance、Academy of Management Discoveries和《金融研究》等期刊。招生方向同时覆盖金融学和数字经济学。[[2]]&#x27;,
            &#x27;2025年学院专业分享课中，她从时间、风险与选择解释金融学，并介绍经济学拔尖学生培养基地和金融培养项目，是目前可核验到的最新公开教学活动。现有官方页未列具体青年基金项目名称和最新论文题目，因此摘要不作补推。[[3]]&#x27;
          ],
          sources: [
            { label: &#x27;李睿｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;李睿&#x27;].url, summary: &#x27;核对学院身份、研究方向和课程。&#x27;, latest: &#x27;截至2026年本次检索仍展示其教师身份、研究方向与课程。&#x27; },
            { label: &#x27;李睿｜研究生院导师档案&#x27;, url: advisorUrl(20788), summary: &#x27;核对2019年以来任职、北京大学博士背景、课程、基金和期刊概况。&#x27;, latest: &#x27;任职履历更新至2022年至今，内容反映至2026年本次检索。&#x27; },
            { label: &#x27;学院为大一新生开展专业分享课&#x27;, url: &#x27;https://jgsy.uestc.edu.cn/info/1040/1629.htm&#x27;, summary: &#x27;记录李睿介绍金融核心观念、经济学拔尖基地与金融培养项目。&#x27;, latest: &#x27;发布于2025年12月16日。&#x27; }
          ]
        },
        &#x27;梁媛&#x27;: {
          paragraphs: [
            &#x27;梁媛毕业于华中科技大学，现为电子科技大学经济与管理学院副教授、硕士生导师。官方页面未披露籍贯。其研究方向包括宏观经济、外资并购和委托代理理论，教学则长期围绕经济学核心课程展开。[[1]]&#x27;,
            &#x27;学院页面与课程报道显示，她推动经济学通识课面向工科学生重塑课程目标和教学设计，强调经济学思维、跨学科融通、线上线下闭环以及科教产教融合。相关经济学MOOC于2020年获国家精品在线开放课程，2021年上线“学习强国”，2023年获四川省一流本科课程。[[2]]&#x27;,
            &#x27;2025年公开报道继续介绍其团队以“三融一体”模式服务工科拔尖人才培养。这些近期材料更能说明其课程建设和教学改革动向；目前未检索到同等更新程度的个人科研项目清单，因此不将教学报道延伸解释为新的研究项目。[[2]]&#x27;
          ],
          sources: [
            { label: &#x27;梁媛｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;梁媛&#x27;].url, summary: &#x27;核对学院身份、教育经历、宏观经济与并购研究方向。&#x27;, latest: &#x27;截至2026年本次检索仍展示其教师身份与研究方向；近期教学活动由2025年报道补充。&#x27; },
            { label: &#x27;电子科大副教授以经济学核心通识课赋能工科拔尖领军人才培养&#x27;, url: &#x27;https://www.sohu.com/a/844948469_504725&#x27;, summary: &#x27;第三方教育媒体转述梁媛团队的课程目标、“三融一体”教学模式及一流课程建设。&#x27;, latest: &#x27;发布于2025年1月3日；为外部转载，课程事实仍以校方材料为准。&#x27; }
          ]
        },
        &#x27;刘波&#x27;: {
          paragraphs: [
            &#x27;刘波为经济与管理学院教授、博士生导师，并承担电子科技大学iMBA项目相关工作。官方页面未披露籍贯。其研究覆盖企业战略与投融资管理、数字化转型、金融科技和资本市场，兼具公司金融与战略管理视角。[[1]][[2]]&#x27;,
            &#x27;研究生院页面显示其主持国家自然科学基金项目3项、四川省科技支撑计划项目和教育部产学合作项目；成果发表于European Journal of Finance、《经济研究》《金融研究》等，并获得金融学术会议奖和省级科研奖励。[[2]]&#x27;,
            &#x27;公开页面还列其参与金融科技研究与教育、上市公司论坛和金融期刊工作。由于导师页没有给出项目起止年份和近年论文题目，本次检索只能确认其当前方向与累计成果，不能把“主持3项基金”解释成近三年新立项。[[1]][[2]]&#x27;
          ],
          sources: [

            { label: &#x27;刘波｜研究生院导师档案&#x27;, url: advisorUrl(11194), summary: &#x27;核对导师身份、主持项目数量、研究领域与获奖概况。&#x27;, latest: &#x27;截至2026年本次检索仍展示其导师身份、研究领域与项目概况。&#x27; }
          ]
        },
        &#x27;刘英&#x27;: {
          paragraphs: [
            &#x27;刘英在电子科技大学获得企业管理博士学位，曾赴美国圣地亚哥大学访学，并具有中国注册会计师和会计师事务所审计经历。官方页面未披露籍贯。其方向包括会计理论、营运资金管理、供应链金融和数字化财务。[[1]][[2]]&#x27;,
            &#x27;她讲授《会计理论与实务》《会计学》《财务分析与评价》等课程，研究将财务报表、供应链契约、信用融资和企业资金风险联系起来；主持国家自然科学基金面上项目“新兴市场供应链可持续战略与营运资金风险实证研究”。[[2]]&#x27;,
            &#x27;公开论文清单中较新的成果为2021年有关持股型供应链订货与定价的研究，此后未检索到能够由校方页面确认的更新论文或新闻。因此页面会把“最新内容止于2021年”直接写在来源卡片中。[[2]]&#x27;
          ],
          sources: [
            { label: &#x27;刘英｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;刘英&#x27;].url, summary: &#x27;核对学院身份、教育背景、课程和会计与供应链金融方向。&#x27;, latest: &#x27;截至2026年本次检索仍展示其教师身份、研究方向与课程；可定年成果以导师档案为准。&#x27; },
            { label: &#x27;刘英｜研究生院导师档案&#x27;, url: advisorUrl(12374), summary: &#x27;核对注册会计师背景、自然科学基金项目和代表论文。&#x27;, latest: &#x27;论文列表最新止于2021年，访学经历止于2020年。&#x27; }
          ]
        },
        &#x27;马捷&#x27;: {
          paragraphs: [
            &#x27;马捷在西南交通大学完成会计学本科、产业经济学硕士和管理科学与工程博士训练，曾赴美国亚利桑那大学、威廉玛丽学院等访学。官方页面未披露籍贯。当前学院页面将其列为教授、博士生导师和经济学与金融学系主任。[[1]]&#x27;,
            &#x27;其研究方向为网络分析、复杂性与区域治理、区域可持续发展，招生方向扩展到产业经济学和数字经济学；课程包括中级微观经济学、高级宏观经济学、经济研究方法、经济学前沿和管理经济学。[[1]][[2]]&#x27;,
            &#x27;代表研究涉及区域环境合作网络、政务信息传播、可再生能源转型和公共资源治理。当前职务与教授任职信息延续至今，但学院论文列表最新止于2020年，导师页项目清单更早；因此可确认的近年动向主要是系务与经济学课程建设，而非新论文发布。[[1]]&#x27;
          ],
          sources: [
            { label: &#x27;马捷（系主任）｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;马捷&#x27;].url, summary: &#x27;核对当前职务、教授任职、教育与访问经历、课程和研究成果。&#x27;, latest: &#x27;任职经历更新到2021年至今；论文列表最新止于2020年。&#x27; },
            { label: &#x27;马捷｜研究生院导师档案&#x27;, url: advisorUrl(10927), summary: &#x27;核对导师身份、产业经济与数字经济招生方向。&#x27;, latest: &#x27;项目清单主要止于2010年前后；导师身份截至2026年本次检索仍在展示。&#x27; }

        &#x27;毛奕欢&#x27;: {
          paragraphs: [
            &#x27;毛奕欢在西南财经大学完成财务管理本科、资产评估硕士和会计学博士学习，2023—2025年从事经济学博士后研究，现为副教授。官方页面未披露籍贯。她讲授会计学、成本管理会计，研究资本市场财务会计行为、制度变迁和公司治理。[[1]]&#x27;,
            &#x27;其2024年成果涉及环境纪录片与盈余管理、银行竞争与企业金融化、数字经济与企业创新、公共监督与绿色创新、董事会IT专长和内部控制；页面还列出2025年环境信息公开研究以及2026年链长制与供应链空间布局论文，并注明主持国家自然科学基金青年项目和博士后基金。[[1]]&#x27;,
            &#x27;2025年MBA“明势讲堂”中，她以语言、框架效应和资本市场判断为主题，将行为经济学与上市公司案例结合。这一活动与其资本市场信息和认知偏差研究相互呼应，是目前能够核验到的近期公开教学活动。[[2]]&#x27;
          ],
          sources: [
            { label: &#x27;毛奕欢｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;毛奕欢&#x27;].url, summary: &#x27;核对教育经历、课程、2024—2026年论文和主持项目。&#x27;, latest: &#x27;论文列表最新列至2026年，包含一项标为2026年第7期的成果。&#x27; },
            { label: &#x27;明势讲堂｜毛奕欢：语言的力量&#x27;, url: &#x27;https://www.mba.uestc.edu.cn/info/1014/7601.htm&#x27;, summary: &#x27;记录其以语言、框架效应、资本市场判断和心理赋能为主题的讲座。&#x27;, latest: &#x27;发布于2025年6月18日，讲座于2025年6月21日举行。&#x27; }
          ]
        },
        &#x27;倪得兵&#x27;: {
          paragraphs: [
            &#x27;倪得兵本科接受管理工程训练，后在电子科技大学取得数量经济学硕士和管理科学与工程博士学位，并曾赴加拿大温莎大学、美国南卫理公会大学访学。官方页面未披露籍贯。其研究重点为博弈理论、供应链与数字化运营、产业经济和数字经济。[[1]][[2]]&#x27;,
            &#x27;研究主题包括供应链社会责任分配、平台与制造商竞争、柔性决策、污染河流治理和外包机制。研究生院当前招生方向为数智运营与供应链管理、产业经济学和数字经济学。[[2]]&#x27;,
            &#x27;2025年研究院人物介绍显示，其累计主持国家自然科学基金青年、面上和应急项目4项，参与重点项目2项，发表论文60余篇，并列有四川省学术和技术带头人等人才称号。该页提供的是截至2025年的综合履历，没有列出2025年新论文题目。[[3]]&#x27;
          ],
          sources: [
            { label: &#x27;倪得兵｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;倪得兵&#x27;].url, summary: &#x27;核对教育经历、博弈论与供应链研究方向。&#x27;, latest: &#x27;截至2026年本次检索仍展示其教师身份与研究方向；近期成果概况由2025年介绍补充。&#x27; },
            { label: &#x27;倪得兵｜研究生院导师档案&#x27;, url: advisorUrl(10537), summary: &#x27;核对导师身份、招生方向和较早代表论文。&#x27;, latest: &#x27;论文列表主要止于2012年；招生方向截至2026年本次检索仍在展示。&#x27; },
            { label: &#x27;倪得兵教授｜人文社科高研院&#x27;, url: &#x27;https://aihss.uestc.edu.cn/info/1095/1248.htm&#x27;, summary: &#x27;补充截至2025年的基金数量、论文数量、人才称号和奖励。&#x27;, latest: &#x27;发布于2025年6月10日。&#x27; }
          ]

        &#x27;沈玉清&#x27;: {
          paragraphs: [
            &#x27;沈玉清现为经济与管理学院副教授。校级课程团队公开资料将其研究方向概括为公司财务、实证会计、审计和创业融资；学院当前教师页主要保留身份与学术服务信息。官方页面未披露籍贯，外部旧词条虽提供出生地说法，但缺少校方交叉确认，故不写入事实摘要。[[1]][[2]]&#x27;,
            &#x27;其研究主题围绕企业信息、融资决策、会计行为和治理机制，与公司金融、财务分析及创业融资课程方向相关。当前可核验的校级课程团队页面还能确认其参与公司财务类课程建设。[[2]]&#x27;,
            &#x27;需要特别注意资料新旧：学院教师页没有列出论文、项目或近年新闻，课程团队页也未标明确切更新时间。此次检索未找到可由电子科大官方页面确认的2022—2026年个人科研动态，因此页面会明确标记“最新年份不明”，而不是补写未经核实的近况。[[1]][[2]]&#x27;
          ],
          sources: [
            { label: &#x27;沈玉清｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;沈玉清&#x27;].url, summary: &#x27;核对当前副教授身份和学院学术服务信息。&#x27;, latest: &#x27;截至2026年本次检索仍展示其副教授身份与学院学术服务信息。&#x27; },
            { label: &#x27;公司财务课程团队成员页&#x27;, url: &#x27;https://i.study.uestc.edu.cn/VCFE/menu/team-members&#x27;, summary: &#x27;核对公司财务、实证会计、审计与创业融资研究方向及课程团队关系。&#x27;, latest: &#x27;课程平台中可定年的素材主要形成于2020年前后，内容时间止于2020年。&#x27; }
          ]
        },
        &#x27;宋娜&#x27;: {
          paragraphs: [
            &#x27;宋娜本科就读武汉大学数学基地班并辅修金融学，后在香港大学取得数理金融博士学位，曾赴澳大利亚麦考瑞大学访学。官方页面未披露籍贯。学院当前将其列为副教授和经济学与金融学系支部书记。[[1]][[2]]&#x27;,
            &#x27;其研究包括算法交易策略、投资组合管理、衍生品定价、随机利率与债券风险；课程包括金融数学、金融衍生工具、全英文金融学基础和MBA大数据金融风险管理。主持的国家自然科学基金青年项目研究流动性不足市场中的价格冲击成本与动态投资组合选择。[[1]]&#x27;,
            &#x27;公开科研清单最新项目周期止于2020年，论文列表最新为2019年接收；2020年学院还展示过其《金融数学》课程。现行页面可确认当前身份和课程，但未发现近三年的个人项目或论文新闻。[[1]][[3]]&#x27;
          ],
          sources: [
            { label: &#x27;宋娜（支部书记）｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;宋娜&#x27;].url, summary: &#x27;核对当前身份、数理金融方向、课程、论文与自然科学基金项目。&#x27;, latest: &#x27;论文列表最新为2019年接收，项目周期止于2020年；支部书记为现行页面表述。&#x27; },
            { label: &#x27;宋娜｜研究生院导师档案&#x27;, url: advisorUrl(11857), summary: &#x27;核对香港大学博士背景、金融经济学课程和较早数理金融论文。&#x27;, latest: &#x27;论文列表主要止于2013年。&#x27; },
            { label: &#x27;宋娜老师：《金融数学》&#x27;, url: &#x27;https://www.mgmt.uestc.edu.cn/info/1260/22721.htm&#x27;, summary: &#x27;用于核对其金融数学课程建设与教学关系。&#x27;, latest: &#x27;发布于2020年7月21日。&#x27; }
          ]
        },
        &#x27;滕颖&#x27;: {
          paragraphs: [
            &#x27;滕颖具有工学、数量经济学和管理学交叉背景，曾赴美国北卡罗来纳大学夏洛特分校访学，并参加百森商学院创业教学培训。官方页面未披露籍贯。她现为教授、博士生导师、电子科技大学以色列研究中心主任。[[1]][[2]]&#x27;,
            &#x27;其研究聚焦平台企业战略、传统企业数字化转型、社会网络、战略创业和国际科技合作。近年论文涉及企业政治嵌入、平台企业价值创造、管理认知转换与战略创业；招生方向包括战略与创新管理、经济系统管理、产业经济与数字经济。[[2]]&#x27;,
            &#x27;近年项目包括2022—2023年四川装备制造业数字化与服务化协同，以及2023—2024年以色列开放式创新体系研究。由此可见，其近期动向主要围绕数字化转型与国际创新合作；公开论文清单最新止于2022年。[[2]]&#x27;
          ],
          sources: [
            { label: &#x27;滕颖｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;滕颖&#x27;].url, summary: &#x27;核对教育经历、当前研究中心职务和研究方向。&#x27;, latest: &#x27;截至2026年本次检索仍展示其研究中心职务与研究方向；可定年成果以导师档案为准。&#x27; },
            { label: &#x27;滕颖｜研究生院导师档案&#x27;, url: advisorUrl(10529), summary: &#x27;核对2020—2024年项目、2021—2022年论文及招生方向。&#x27;, latest: &#x27;项目最新止于2024年，论文列表最新止于2022年。&#x27; }
          ]
        },
        &#x27;田益祥&#x27;: {
          paragraphs: [
            &#x27;田益祥本科接受数学训练，后取得管理学硕士和经济学博士学位，并曾赴英国南安普顿大学访学。官方页面未披露籍贯。其长期方向包括金融计量、投资策略、信用评级、系统性风险、绿色债券和金融产品定价。[[1]][[2]]&#x27;,
            &#x27;近五年公开成果集中在绿色债券定价、碳交易与政府干预、绿色债券均衡价格、数字化转型与全要素生产率、评级监管以及金融机构风险溢出。2023—2024年多篇论文发表于International Review of Economics &amp; Finance、Expert Systems with Applications等期刊。[[2]]&#x27;,
            &#x27;其当前主持的国家社会科学基金项目“资源配置视角下绿色债券的价格形成机制及政策效能提升路径”于2024年立项。这是目前最明确的近年项目动向，与银行风控、债券市场和量化实证方向高度相关。[[2]]&#x27;
          ],
          sources: [
            { label: &#x27;田益祥｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;田益祥&#x27;].url, summary: &#x27;核对金融计量、风险管理、课程和学院身份。&#x27;, latest: &#x27;截至2026年本次检索仍展示其教师身份、研究方向与课程；最新可定年成果为导师档案中的2024年项目和论文。&#x27; },
            { label: &#x27;田益祥｜研究生院导师档案&#x27;, url: advisorUrl(10518), summary: &#x27;核对2024年国家社科项目、2023—2024年绿色债券论文和系统性风险成果。&#x27;, latest: &#x27;项目和论文最新均止于2024年。&#x27; }
          ]
        },
        &#x27;王啸远&#x27;: {
          paragraphs: [
            &#x27;王啸远本科毕业于南京财经大学国际经济与贸易专业，后在美国德州农工大学取得经济学博士学位。官方页面未披露籍贯。其研究方向为产业组织、行为经济学和应用微观经济学，课程包括实验经济学、产业组织和行为科学研究。[[1]]&#x27;,
            &#x27;代表论文研究实验消费品市场中的搜索阻吓、在线社区回复行为和工资个性化中的互惠信息；页面还列有品牌饱和、消费者访问模式、认知层级模型及信任博弈等工作论文，以及住房市场搜索阻吓和互惠机制等在研问题。[[1]]&#x27;,
            &#x27;2023年电子科大与里斯本大学学院合作的DoM研究方法课程中，他承担外方教授授课的翻译与教学协作，表明其仍参与实证研究方法训练。当前教师页的正式论文最新止于2021年，2023年课程协作是目前检索到的最新校内公开活动。[[2]]&#x27;
          ],
          sources: [
            { label: &#x27;王啸远｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;王啸远&#x27;].url, summary: &#x27;核对教育经历、研究方向、课程、论文、工作论文和在研主题。&#x27;, latest: &#x27;正式论文列表最新止于2021年；在研项目未标年份。&#x27; },
            { label: &#x27;2023级《实证研究-1：研究方法》在电子科技大学行课&#x27;, url: &#x27;https://dom.uestc.edu.cn/info/1070/1192.htm&#x27;, summary: &#x27;记录王啸远参与DoM研究方法课程的翻译与教学协作。&#x27;, latest: &#x27;活动发生于2023年11月，页面发布于2023年。&#x27; }
          ]
        },
        &#x27;夏晖&#x27;: {
          paragraphs: [
            &#x27;夏晖本科毕业于四川大学数学系，在电子科技大学取得管理学博士学位，曾赴香港中文大学和美国佐治亚理工大学访问。官方页面未披露籍贯。现为教授、经济与管理学院实验与信息中心主任。[[1]]&#x27;,
            &#x27;其研究包括公司投融资管理、金融量化交易策略和碳排放配额分配机制；代表成果涉及多目标碳配额、减排技术投资、VWAP交易策略和创新投资。著作与教材包括碳排放权分配、创新创业投融资管理和金融交易策略设计。[[1]]&#x27;,
            &#x27;近年动向主要体现为实验教学与平台建设：学校2023年报道其推动金融证券实验室、数据库、虚拟仿真实验和学院信息化建设；教师页还列出2025年四川省社科成果奖。当前一年方案中其承担《金融经济学》，但公开页面没有披露具体课堂分工和考核方式。[[1]][[2]]&#x27;
          ],
          sources: [
            { label: &#x27;夏晖｜经济与管理学院教师档案&#x27;, url: teacherDirectory[&#x27;夏晖&#x27;].url, summary: &#x27;核对当前职务、研究方向、论文、教材与2025年获奖信息。&#x27;, latest: &#x27;荣誉列表最新止于2025年，论文列表最新止于2019年。&#x27; },
            { label: &#x27;夏晖：推进实验与信息中心建设 服务教育教学&#x27;, url: &#x27;https://new1.uestc.edu.cn/?n=UestcNews.Front.DocumentV2.ArticlePage&amp;Id=89071&#x27;, summary: &#x27;记录金融实验室、数据库、虚拟仿真实验课程和学院信息化建设。&#x27;, latest: &#x27;发布于2023年4月18日；搜索页显示的较新日期是页面抓取时间，不是新闻发布时间。&#x27; }
          ]
        },
        &#x27;杨政&#x27;: {
          paragraphs: [
            &#x27;杨政本科就读应用数学，后接受统计学和应用数学博士训练，并曾赴美国雪城大学Maxwell学院访学。官方页面未披露籍贯。其长期研究方向为金融计量、非线性时间序列与协整分析，以及汇率、贸易和金融市场。[[1]][[2]]&#x27;,
            &#x27;其讲授计量经济学、高级计量经济学、金融计量和投资管理等本科、硕士及MBA课程；代表论文涉及门限与平滑转换协整、亚洲股价与汇率动态关系、人民币汇率波动对出口的非对称影响以及期货市场VaR估计。[[2]]&#x27;,
            &#x27;该训练与量化实证路线匹配度较高，但官方项目清单最新止于2018年、论文列表最新止于2016年。此次检索未发现能够可靠归属其本人的近三年校内新闻，因此页面不会把“长期授课”误写成近期科研成果。[[2]]&#x27;
          ],

      finalPlanOptions.innerHTML = plans.map((plan, index) =&gt; `&lt;button type=&quot;button&quot; class=&quot;btn${index === 0 ? &#x27; btn-primary&#x27; : &#x27;&#x27;}&quot; data-final-plan=&quot;${plan.id}&quot; aria-pressed=&quot;${index === 0 ? &#x27;true&#x27; : &#x27;false&#x27;}&quot;&gt;${plan.name}&lt;/button&gt;`).join(&#x27;&#x27;);
      finalPolitics.innerHTML = politicsCourses.map(course =&gt; `&lt;option value=&quot;${course}&quot;&gt;${course}&lt;/option&gt;`).join(&#x27;&#x27;);
      finalQualityOptions.innerHTML = qualityCourses.map(course =&gt; `&lt;div class=&quot;mf-choice-row&quot;&gt;&lt;div class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;mf-quality-${course.id}&quot; data-quality=&quot;${course.id}&quot; checked&gt;&lt;label class=&quot;form-check-label&quot; for=&quot;mf-quality-${course.id}&quot;&gt;${course.name} · ${course.credits}学分 · ${course.opening} · 考查 · ${course.scheduleNote}&lt;/label&gt;&lt;/div&gt;&lt;label class=&quot;sr-only&quot; for=&quot;mf-quality-term-${course.id}&quot;&gt;${course.name}安排学期&lt;/label&gt;&lt;select class=&quot;form-select&quot; id=&quot;mf-quality-term-${course.id}&quot; data-quality-term=&quot;${course.id}&quot;&gt;&lt;option value=&quot;秋季&quot; selected&gt;秋季&lt;/option&gt;&lt;option value=&quot;春季&quot;&gt;春季&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      finalExtraOptions.innerHTML = extraCourses.map(course =&gt; {
        const selector = course.flexible ? `&lt;label class=&quot;sr-only&quot; for=&quot;mf-extra-term-${course.id}&quot;&gt;${course.name}安排学期&lt;/label&gt;&lt;select class=&quot;form-select&quot; id=&quot;mf-extra-term-${course.id}&quot; data-extra-term=&quot;${course.id}&quot; disabled&gt;&lt;option value=&quot;秋季&quot;&gt;秋季&lt;/option&gt;&lt;option value=&quot;春季&quot; selected&gt;春季&lt;/option&gt;&lt;/select&gt;` : &#x27;&#x27;;
        return `&lt;div class=&quot;mf-choice-row&quot;&gt;&lt;div class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;mf-extra-${course.id}&quot; data-extra=&quot;${course.id}&quot;&gt;&lt;label class=&quot;form-check-label&quot; for=&quot;mf-extra-${course.id}&quot;&gt;${course.name} · ${course.credits}学分 · ${course.opening} · ${assessmentByCourse[course.name]} · ${course.scheduleNote}&lt;/label&gt;&lt;/div&gt;${selector}&lt;/div&gt;`;
      }).join(&#x27;&#x27;);

      const finalTagHtml = category =&gt; `&lt;span class=&quot;mf-type-tag mf-type-${categoryColor(category)}&quot;&gt;${category}&lt;/span&gt;`;
      const finalRowHtml = row =&gt; `&lt;tr&gt;&lt;td class=&quot;text-nowrap&quot;&gt;${row[0]}&lt;/td&gt;&lt;td&gt;${row[1]}&lt;/td&gt;&lt;td&gt;${finalTagHtml(row[2])}&lt;/td&gt;&lt;td class=&quot;text-nowrap&quot;&gt;${row[3]}&lt;/td&gt;&lt;td class=&quot;text-nowrap&quot;&gt;${assessmentByCourse[row[1]] || &#x27;考查&#x27;}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${row[4]}&lt;/td&gt;&lt;/tr&gt;`;
      const finalSemesterRowHtml = row =&gt; `&lt;tr&gt;&lt;td&gt;${row[1]}&lt;/td&gt;&lt;td&gt;${finalTagHtml(row[2])}&lt;/td&gt;&lt;td class=&quot;text-nowrap&quot;&gt;${row[3]}&lt;/td&gt;&lt;td class=&quot;text-nowrap&quot;&gt;${assessmentByCourse[row[1]] || &#x27;考查&#x27;}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${row[4]}&lt;/td&gt;&lt;/tr&gt;`;

      function selectedExtras() {
        return extraCourses.filter(course =&gt; root.querySelector(`[data-extra=&quot;${course.id}&quot;]`).checked).map(course =&gt; {
          const termControl = root.querySelector(`[data-extra-term=&quot;${course.id}&quot;]`);
          return { ...course, term: termControl ? termControl.value : course.term };
        });
      }

      function selectedQualityCourses() {
        return qualityCourses.filter(course =&gt; root.querySelector(`[data-quality=&quot;${course.id}&quot;]`).checked).map(course =&gt; ({
          ...course,
          term: root.querySelector(`[data-quality-term=&quot;${course.id}&quot;]`).value
        }));
      }

      const meetingRunsInWeek = (meeting, week) =&gt; meeting.weeks.some(range =&gt; week &gt;= range[0] &amp;&amp; week &lt;= range[1]);
      const periodsOverlap = (a, b) =&gt; a.start &lt;= b.end &amp;&amp; b.start &lt;= a.end;
      const rangesText = weeks =&gt; weeks.map(range =&gt; range[0] === range[1] ? `${range[0]}周` : `${range[0]}-${range[1]}周`).join(&#x27;、&#x27;);
      const overlappingWeekRanges = (a, b) =&gt; a.weeks.flatMap(left =&gt; b.weeks.map(right =&gt; [Math.max(left[0], right[0]), Math.min(left[1], right[1])])).filter(range =&gt; range[0] &lt;= range[1]);
      const visualItemKey = item =&gt; [item.course, item.category, item.code, item.teacher, item.meeting.day, item.meeting.room].join(&#x27;|&#x27;);

      function mergeDisplayItems(items, conflictItems) {
        const groups = new Map();
        items.forEach(item =&gt; {
          const key = visualItemKey(item);
          if (!groups.has(key)) groups.set(key, { ...item, meetings: [], sourceItems: [] });
          groups.get(key).meetings.push(item.meeting);
          groups.get(key).sourceItems.push(item);
        });
        return [...groups.values()].map(item =&gt; ({
          ...item,
          start: Math.min(...item.meetings.map(meeting =&gt; meeting.start)),
          end: Math.max(...item.meetings.map(meeting =&gt; meeting.end)),
          conflict: item.sourceItems.some(source =&gt; conflictItems.has(source))
        }));
      }

      function assignDisplayLanes(items) {
        const sorted = [...items].sort((a, b) =&gt; a.start - b.start || a.end - b.end || a.course.localeCompare(b.course, &#x27;zh-CN&#x27;));
        const hasVisualOverlap = item =&gt; sorted.some(other =&gt; other !== item &amp;&amp; periodsOverlap(item, other));
        const laneEnds = [];
        sorted.forEach(item =&gt; {
          if (!hasVisualOverlap(item)) {
            item.fullWidth = true;
            item.lane = 0;
            return;
          }
          let lane = laneEnds.findIndex(end =&gt; item.start &gt; end);
          if (lane === -1) lane = laneEnds.length;
          laneEnds[lane] = item.end;
          item.fullWidth = false;
          item.lane = lane;
        });
        return { items: sorted, laneCount: Math.max(1, laneEnds.length) };
      }

      function updateWeekNavigation() {
        const wholeSemester = scheduleWeek.value === &#x27;all&#x27;;
        const week = Number(scheduleWeek.value || 0);
        weekPrev.disabled = wholeSemester || week &lt;= 1;
        weekNext.disabled = !wholeSemester &amp;&amp; week &gt;= 16;
      }

      function renderWeekSchedule() {
        updateWeekNavigation();
        const semester = scheduleSemester.value;
        const wholeSemester = scheduleWeek.value === &#x27;all&#x27;;
        const week = Number(scheduleWeek.value || 1);
        const mobileTimetable = mobileScheduleMedia.matches;
        const days = mobileTimetable
          ? [&#x27;一&#x27;, &#x27;二&#x27;, &#x27;三&#x27;, &#x27;四&#x27;, &#x27;五&#x27;, &#x27;六&#x27;, &#x27;日&#x27;]
          : [&#x27;星期一&#x27;, &#x27;星期二&#x27;, &#x27;星期三&#x27;, &#x27;星期四&#x27;, &#x27;星期五&#x27;];
        const autumnCourseNames = new Set(currentFinalRows.filter(row =&gt; row[0] === &#x27;秋季&#x27;).map(row =&gt; row[1]));
        aiSectionControl.hidden = scheduleSemester.value !== &#x27;autumn&#x27; || !autumnCourseNames.has(&#x27;人工智能与机器学习&#x27;);
        ipSectionControl.hidden = scheduleSemester.value !== &#x27;autumn&#x27; || !autumnCourseNames.has(&#x27;知识产权与信息检索&#x27;);
        sportsSectionControl.hidden = scheduleSemester.value !== &#x27;autumn&#x27; || !autumnCourseNames.has(&#x27;体育技能、欣赏与文化&#x27;);
        stressSectionControl.hidden = scheduleSemester.value !== &#x27;autumn&#x27; || !autumnCourseNames.has(&#x27;压力管理的艺术&#x27;);

        if (semester === &#x27;spring&#x27;) {
          scheduleStatus.innerHTML = `&lt;div class=&quot;mf-status-line&quot;&gt;&lt;span class=&quot;mf-status-mark is-pending&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;2027春季课表尚未发布。&lt;/strong&gt;课程清单可以按春季查看，但当前不能做可靠冲突判断。&lt;/span&gt;&lt;/div&gt;`;
          weekGrid.innerHTML = `&lt;div class=&quot;mf-week-empty&quot;&gt;等待学校发布春季教学班周次与节次&lt;/div&gt;`;
          conflictBox.classList.remove(&#x27;has-conflict&#x27;);
          conflictBox.textContent = &#x27;春季排课未发布：不把“尚无数据”解释成“没有冲突”。&#x27;;
          return;
        }

        const scheduled = [];
        const courseCategories = new Map(currentFinalRows.map(row =&gt; [row[1], row[2]]));
        Object.entries(verifiedSchedules).forEach(([course, detail]) =&gt; {
          if (!autumnCourseNames.has(course)) return;
          detail.meetings.forEach(meeting =&gt; scheduled.push({ course, category: courseCategories.get(course) || &#x27;专业基础&#x27;, code: detail.code, teacher: detail.teacher, meeting }));
        });
        const selectedEnglish = englishSections.find(section =&gt; section.id === englishSection.value) || englishSections[0];
        if (autumnCourseNames.has(&#x27;硕士研究生英语&#x27;) &amp;&amp; selectedEnglish.id !== &#x27;none&#x27;) {
          selectedEnglish.meetings.forEach(meeting =&gt; scheduled.push({ course: &#x27;硕士研究生英语&#x27;, category: &#x27;公共基础&#x27;, code: &#x27;1700005008&#x27;, teacher: selectedEnglish.label.split(&#x27; · &#x27;).pop().replace(&#x27;（冲突）&#x27;, &#x27;&#x27;), meeting }));
        }
        const selectedModernization = modernizationSections.find(section =&gt; section.id === modernizationSection.value) || modernizationSections[0];
        if (autumnCourseNames.has(&#x27;中国式现代化的理论与实践&#x27;) &amp;&amp; selectedModernization.id !== &#x27;none&#x27;) {
          selectedModernization.meetings.forEach(meeting =&gt; scheduled.push({ course: &#x27;中国式现代化的理论与实践&#x27;, category: &#x27;公共基础&#x27;, code: &#x27;1800005008&#x27;, teacher: selectedModernization.label.split(&#x27; · &#x27;).pop().replace(&#x27;（冲突）&#x27;, &#x27;&#x27;), meeting }));
        }
        const selectedAi = aiSections.find(section =&gt; section.id === aiSection.value) || aiSections[0];
        if (autumnCourseNames.has(&#x27;人工智能与机器学习&#x27;) &amp;&amp; selectedAi.id !== &#x27;none&#x27;) {
          selectedAi.meetings.forEach(meeting =&gt; scheduled.push({ course: &#x27;人工智能与机器学习&#x27;, category: &#x27;其他选修·加选&#x27;, code: &#x27;1512016010&#x27;, teacher: selectedAi.teacher, meeting }));
        }
        const selectedIp = ipSections.find(section =&gt; section.id === ipSection.value) || ipSections[0];
        if (autumnCourseNames.has(&#x27;知识产权与信息检索&#x27;) &amp;&amp; selectedIp.id !== &#x27;none&#x27;) {
          selectedIp.meetings.forEach(meeting =&gt; scheduled.push({ course: &#x27;知识产权与信息检索&#x27;, category: &#x27;其他选修·加选&#x27;, code: &#x27;1500005004&#x27;, teacher: selectedIp.teacher, meeting }));
        }
        const sportsValue = sportsSection.value;
        sportsSections.forEach(section =&gt; {
          const option = [...sportsSection.options].find(item =&gt; item.value === section.id);
          if (!option) return;
          const hasConflict = section.id !== &#x27;none&#x27; &amp;&amp; section.meetings.some(meeting =&gt;
            scheduled.some(item =&gt;
              meeting.day === item.meeting.day
              &amp;&amp; periodsOverlap(meeting, item.meeting)
              &amp;&amp; overlappingWeekRanges(meeting, item.meeting).length
            )
          );
          option.textContent = `${section.label}${hasConflict ? &#x27;（冲突）&#x27; : &#x27;&#x27;}`;
        });
        sportsSection.value = sportsValue;
        const selectedSports = sportsSections.find(section =&gt; section.id === sportsSection.value) || sportsSections[0];
        if (autumnCourseNames.has(&#x27;体育技能、欣赏与文化&#x27;) &amp;&amp; selectedSports.id !== &#x27;none&#x27;) {
          selectedSports.meetings.forEach(meeting =&gt; scheduled.push({ course: &#x27;体育技能、欣赏与文化&#x27;, category: &#x27;必修环节·素质教育&#x27;, code: &#x27;2000025001&#x27;, teacher: selectedSports.teacher, meeting }));
        }
        const active = wholeSemester ? scheduled : scheduled.filter(item =&gt; meetingRunsInWeek(item.meeting, week));
        const conflictPairs = [];
        active.forEach((item, index) =&gt; active.slice(index + 1).forEach(other =&gt; {
          const overlappingWeeks = overlappingWeekRanges(item.meeting, other.meeting);
          if (item.meeting.day === other.meeting.day &amp;&amp; periodsOverlap(item.meeting, other.meeting) &amp;&amp; (!wholeSemester || overlappingWeeks.length)) conflictPairs.push({ items: [item, other], overlappingWeeks });
        }));
        const conflictItems = new Set(conflictPairs.flatMap(pair =&gt; pair.items));

        const periodSlots = Array.from({ length: 11 }, (_, index) =&gt; `&lt;div class=&quot;mf-period-slot&quot; style=&quot;grid-row:${index + 1}&quot;&gt;${mobileTimetable ? index + 1 : `第${index + 1}节`}&lt;/div&gt;`).join(&#x27;&#x27;);
        let gridHtml = `&lt;div class=&quot;mf-week-cell mf-week-head&quot;&gt;节次&lt;/div&gt;${days.map(day =&gt; `&lt;div class=&quot;mf-week-cell mf-week-head&quot;&gt;${day}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;mf-period-track&quot;&gt;${periodSlots}&lt;/div&gt;`;
        days.forEach((_, dayIndex) =&gt; {
          const dayItems = mergeDisplayItems(active.filter(item =&gt; item.meeting.day === dayIndex + 1), conflictItems);
          const layout = assignDisplayLanes(dayItems);
          const backgroundSlots = Array.from({ length: 11 }, (_, index) =&gt; `&lt;div class=&quot;mf-period-slot&quot; style=&quot;grid-row:${index + 1}&quot;&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
          const chips = layout.items.map(item =&gt; {
            const scheduleRules = [...new Set(item.meetings.map(meeting =&gt; `${meeting.start}-${meeting.end}节 · ${rangesText(meeting.weeks)}`))];
            const scheduleLines = scheduleRules.join(&#x27;；&#x27;);
            const mobileWeekRules = [...new Set(item.meetings.map(meeting =&gt; rangesText(meeting.weeks)))];
            const scheduleHtml = (mobileTimetable ? mobileWeekRules : scheduleRules).map(rule =&gt; `&lt;span&gt;${rule}&lt;/span&gt;`).join(&#x27;&#x27;);
            const column = item.fullWidth ? &#x27;1 / -1&#x27; : String(item.lane + 1);
            return `&lt;div class=&quot;mf-class-chip mf-course-color mf-type-${categoryColor(item.category)}${item.conflict ? &#x27; is-conflict&#x27; : &#x27;&#x27;}&quot; style=&quot;grid-row:${item.start}/${item.end + 1};grid-column:${column}&quot; title=&quot;${item.course} · ${item.category} · ${item.teacher} · ${item.meeting.room} · ${scheduleLines} · ${item.code}&quot;&gt;&lt;span class=&quot;mf-class-head&quot;&gt;&lt;span class=&quot;mf-class-badges&quot;&gt;&lt;span class=&quot;mf-class-category&quot;&gt;${item.category}&lt;/span&gt;${item.conflict ? &#x27;&lt;span class=&quot;mf-conflict-badge&quot;&gt;冲突&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/span&gt;&lt;strong&gt;${item.course}&lt;/strong&gt;&lt;/span&gt;&lt;span class=&quot;mf-class-meta&quot;&gt;&lt;span class=&quot;mf-class-teacher&quot;&gt;${item.teacher}&lt;/span&gt;&lt;span class=&quot;mf-class-room&quot;&gt;${item.meeting.room}&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;mf-class-schedule&quot;&gt;${scheduleHtml}&lt;/span&gt;&lt;/div&gt;`;
          }).join(&#x27;&#x27;);
          gridHtml += `&lt;div class=&quot;mf-day-track&quot; style=&quot;--mf-lanes:${layout.laneCount}&quot;&gt;${backgroundSlots}${chips}&lt;/div&gt;`;
        });
        weekGrid.innerHTML = gridHtml;

        const publishedCourses = [...new Set(scheduled.map(item =&gt; item.course))];
        const pendingCourses = [...autumnCourseNames].filter(name =&gt; !publishedCourses.includes(name));
        scheduleStatus.innerHTML = `&lt;div class=&quot;mf-status-line&quot;&gt;&lt;span class=&quot;mf-status-mark&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;已纳入${publishedCourses.length}门：&lt;/strong&gt;${publishedCourses.length ? publishedCourses.join(&#x27;、&#x27;) : &#x27;尚未选择已发布教学班&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;mf-status-line&quot;&gt;&lt;span class=&quot;mf-status-mark is-pending&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;待发布或待选班${pendingCourses.length}门：&lt;/strong&gt;${pendingCourses.length ? pendingCourses.join(&#x27;、&#x27;) : &#x27;无&#x27;}&lt;/span&gt;&lt;/div&gt;`;
        conflictBox.classList.toggle(&#x27;has-conflict&#x27;, conflictPairs.length &gt; 0);
        const scopeLabel = wholeSemester ? &#x27;整个学期&#x27; : `第${week}周`;
        conflictBox.innerHTML = conflictPairs.length ? `&lt;strong&gt;${scopeLabel}发现${conflictPairs.length}组冲突：&lt;/strong&gt;${conflictPairs.map(pair =&gt; { const [first, second] = pair.items; const weeksLabel = wholeSemester ? `，${rangesText(pair.overlappingWeeks)}` : &#x27;&#x27;; return `${first.course} 与 ${second.course}（星期${&#x27;一二三四五六日&#x27;[first.meeting.day - 1]}第${Math.max(first.meeting.start, second.meeting.start)}-${Math.min(first.meeting.end, second.meeting.end)}节${weeksLabel}）`; }).join(&#x27;；&#x27;)}` : `&lt;strong&gt;${scopeLabel}未发现已发布课程之间的时间冲突。&lt;/strong&gt; 待发布课程仍不计入此结论。`;
      }

      function renderFinalView(view) {
        currentFinalView = view;
        const autumnRows = currentFinalRows.filter(row =&gt; row[0] === &#x27;秋季&#x27;);
        const springRows = currentFinalRows.filter(row =&gt; row[0] === &#x27;春季&#x27;);
        const requiredRows = currentFinalRows.filter(row =&gt; row[0] === &#x27;培养环节&#x27;);
        const sumRows = rows =&gt; rows.reduce((sum, row) =&gt; sum + row[4], 0);
        const total = sumRows(currentFinalRows);
        const courseCredits = sumRows(currentFinalRows.filter(row =&gt; row[2] !== &#x27;实践教学&#x27; &amp;&amp; !row[2].startsWith(&#x27;必修环节&#x27;)));
        const practiceCredits = sumRows(currentFinalRows.filter(row =&gt; row[2] === &#x27;实践教学&#x27;));
        const requiredCredits = sumRows(currentFinalRows.filter(row =&gt; row[2].startsWith(&#x27;必修环节&#x27;)));
        const assessmentDetail = rows =&gt; {
          const exams = rows.filter(row =&gt; (assessmentByCourse[row[1]] || &#x27;考查&#x27;) === &#x27;考试&#x27;).length;
          return `${rows.length}门 · 考试${exams}＋考查${rows.length - exams}`;
        };
        const semesterView = view === &#x27;semester&#x27;;
        const weekView = view === &#x27;week&#x27;;
        root.querySelector(&#x27;#mf-final-title&#x27;).textContent = semesterView ? `${currentFinalPlanName}最终方案 · 春秋两栏` : weekView ? `${currentFinalPlanName}最终方案 · 星期课表` : `${currentFinalPlanName}基础上的最终方案`;
        root.querySelector(&#x27;#mf-final-credit-total&#x27;).textContent = `总计 ${total} 学分`;
        root.querySelector(&#x27;#mf-final-table-view&#x27;).hidden = semesterView || weekView;
        root.querySelector(&#x27;#mf-final-semester-view&#x27;).hidden = !semesterView;
        root.querySelector(&#x27;#mf-final-week-view&#x27;).hidden = !weekView;
        root.querySelector(&#x27;#mf-final-body&#x27;).innerHTML = currentFinalRows.map(finalRowHtml).join(&#x27;&#x27;);
        root.querySelector(&#x27;#mf-final-autumn-body&#x27;).innerHTML = autumnRows.map(finalSemesterRowHtml).join(&#x27;&#x27;);
        root.querySelector(&#x27;#mf-final-spring-body&#x27;).innerHTML = springRows.map(finalSemesterRowHtml).join(&#x27;&#x27;);
        root.querySelector(&#x27;#mf-final-required-body&#x27;).innerHTML = requiredRows.map(finalSemesterRowHtml).join(&#x27;&#x27;);
        root.querySelector(&#x27;#mf-final-autumn-total&#x27;).textContent = `${sumRows(autumnRows)}学分`;
        root.querySelector(&#x27;#mf-final-spring-total&#x27;).textContent = `${sumRows(springRows)}学分`;
        root.querySelector(&#x27;#mf-final-required-total&#x27;).textContent = `${sumRows(requiredRows)}学分`;
        root.querySelector(&#x27;#mf-final-stat-total&#x27;).textContent = total;
        root.querySelector(&#x27;#mf-final-stat-breakdown&#x27;).textContent = `课程${courseCredits}＋实践${practiceCredits}＋必修${requiredCredits}`;
        root.querySelector(&#x27;#mf-final-stat-autumn&#x27;).textContent = `${sumRows(autumnRows)}学分`;
        root.querySelector(&#x27;#mf-final-stat-autumn-detail&#x27;).textContent = assessmentDetail(autumnRows);
        root.querySelector(&#x27;#mf-final-stat-spring&#x27;).textContent = `${sumRows(springRows)}学分`;
        root.querySelector(&#x27;#mf-final-stat-spring-detail&#x27;).textContent = assessmentDetail(springRows);
        root.querySelectorAll(&#x27;[data-final-view]&#x27;).forEach(button =&gt; {
          const active = button.dataset.finalView === view;
          button.classList.toggle(&#x27;btn-primary&#x27;, active);
          button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
        });
        if (weekView) renderWeekSchedule();
      }

      function generateFinalPlan() {
        const plan = plans.find(item =&gt; item.id === selectedFinalPlanId) || plans[0];
        const politics = finalPolitics.value;
        const practice = root.querySelector(&#x27;input[name=&quot;mf-final-practice&quot;]:checked&#x27;).value;

              &lt;div class=&quot;credit-map-column-title&quot;&gt;&lt;span&gt;学位课&lt;/span&gt;&lt;span&gt;${fmt(t.degree)} / ≥17${deficit(t.degree,17)}&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;credit-map-group is-public&quot;&gt;
                &lt;div class=&quot;credit-map-group-head&quot;&gt;&lt;span&gt;公共基础&lt;/span&gt;&lt;span&gt;${fmt(sum(publicCourses))}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;credit-map-leaves&quot;&gt;${mapLeaves(publicCourses)}&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;credit-map-group is-foundation credit-map-node${nodeClass(sum(foundationCourses),13)}&quot;&gt;
                &lt;div class=&quot;credit-map-group-head&quot;&gt;&lt;span&gt;专业基础&lt;/span&gt;&lt;span&gt;${fmt(sum(foundationCourses))} / ≥13${deficit(sum(foundationCourses),13)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;credit-map-leaves&quot;&gt;${mapLeaves(foundationCourses)}&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;credit-map-column credit-map-node${nodeClass(sum(proCourses),10)}&quot;&gt;
              &lt;div class=&quot;credit-map-column-title&quot;&gt;&lt;span&gt;非学位课&lt;/span&gt;&lt;span&gt;${fmt(nonDegree)}&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;credit-map-group is-elective credit-map-node${nodeClass(sum(proCourses),10)}&quot;&gt;
                &lt;div class=&quot;credit-map-group-head&quot;&gt;&lt;span&gt;专业选修&lt;/span&gt;&lt;span&gt;${fmt(sum(proCourses))} / ≥10${deficit(sum(proCourses),10)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;credit-map-leaves&quot;&gt;${mapLeaves(proCourses)}&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;credit-map-group is-other&quot;&gt;
                &lt;div class=&quot;credit-map-group-head&quot;&gt;&lt;span&gt;其他选修&lt;/span&gt;&lt;span&gt;${fmt(sum(otherCourses))}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;credit-map-leaves&quot;&gt;${mapLeaves(otherCourses)}&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;credit-map-branch is-practice credit-map-node${nodeClass(t.practice,5)}&quot;&gt;
          &lt;div class=&quot;credit-map-title&quot;&gt;&lt;strong&gt;实践教学&lt;/strong&gt;&lt;span class=&quot;credit-map-value&quot;&gt;${fmt(t.practice)} / ≥5${deficit(t.practice,5)}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;credit-map-stack&quot;&gt;${mapLeaves(practiceLeaves)}&lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;credit-map-branch is-required credit-map-node${nodeClass(t.required,5)}&quot;&gt;
          &lt;div class=&quot;credit-map-title&quot;&gt;&lt;strong&gt;必修环节&lt;/strong&gt;&lt;span class=&quot;credit-map-value&quot;&gt;${fmt(t.required)} / ≥5${deficit(t.required,5)}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;credit-map-stack&quot;&gt;${mapLeaves(requiredLeaves)}&lt;/div&gt;
          &lt;div class=&quot;credit-map-note&quot;&gt;新生入学教育为0学分必做环节。&lt;/div&gt;
        &lt;/section&gt;
      &lt;/div&gt;`;
  };
  let heightSyncFrame;
  const updatePoolScrollHint = () =&gt; {
    const list=el(&#x27;planner-pool-list&#x27;); const hint=el(&#x27;planner-pool-scroll-hint&#x27;);
    if(!list||!hint||!matchMedia(&#x27;(min-width:1051px)&#x27;).matches){ if(hint) hint.hidden=true; return; }
    const listBottom=list.getBoundingClientRect().bottom-1;
    const remaining=[...list.querySelectorAll(&#x27;.course-card&#x27;)].filter(card=&gt;card.getBoundingClientRect().bottom&gt;listBottom).length;
    hint.hidden=remaining===0||list.scrollHeight&lt;=list.clientHeight+1;
    if(!hint.hidden) hint.innerHTML=`还有 &lt;strong&gt;${remaining}&lt;/strong&gt; 门候选课，向下滚动查看`;
  };
  const syncEditorHeights = () =&gt; {
    const poolPanel=document.querySelector(&#x27;.planner-pool&#x27;);
    const termPanels=[el(&#x27;planner-autumn&#x27;)?.closest(&#x27;.planner-panel&#x27;),el(&#x27;planner-spring&#x27;)?.closest(&#x27;.planner-panel&#x27;)].filter(Boolean);
    const panels=[poolPanel,...termPanels].filter(Boolean);
    cancelAnimationFrame(heightSyncFrame);
    panels.forEach(panel=&gt;panel.style.height=&#x27;&#x27;);
    if (!matchMedia(&#x27;(min-width:1051px)&#x27;).matches || panels.length!==3){ updatePoolScrollHint(); return; }
    heightSyncFrame=requestAnimationFrame(()=&gt;{
      panels.forEach(panel=&gt;panel.style.height=&#x27;&#x27;);
      const maxHeight=Math.ceil(Math.max(...termPanels.map(panel=&gt;panel.scrollHeight)));
      panels.forEach(panel=&gt;panel.style.height=`${maxHeight}px`);
      updatePoolScrollHint();
    });
  };
  const renderMetrics = () =&gt; {
    const t=totals(); const values=[[&#x27;总学分&#x27;,t.total,38],[&#x27;课程学分&#x27;,t.course,28],[&#x27;学位课&#x27;,t.degree,17],[&#x27;专业选修&#x27;,t.pro,10],[&#x27;实践教学&#x27;,t.practice,5],[&#x27;必修环节&#x27;,t.required,5]];
    el(&#x27;planner-metrics&#x27;).innerHTML=values.map(([label,value,min])=&gt;`&lt;div class=&quot;planner-metric&quot; data-state=&quot;${value&gt;=min?&#x27;ok&#x27;:&#x27;bad&#x27;}&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;strong&gt;${fmt(value)} / ${min}&lt;/strong&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
    const deficits=values.filter(([,v,m])=&gt;v&lt;m).map(([l,v,m])=&gt;`${l}还差${fmt(m-v)}`);
    const noSections=selectedIds().filter(id=&gt;byId.get(id).sectionGroup&amp;&amp;!state.sections[id]);
    const status=el(&#x27;planner-status&#x27;);
    if(deficits.length){ status.dataset.state=&#x27;warning&#x27;; status.textContent=`当前是未完成草稿：${deficits.join(&#x27;；&#x27;)}。`; }
    else if(noSections.length){ status.dataset.state=&#x27;warning&#x27;; status.textContent=`学分要求已满足，但还有 ${noSections.length} 门课程未选教学班。`; }
    else { status.dataset.state=&#x27;ok&#x27;; status.textContent=&#x27;当前草稿满足培养方案的各项最低学分要求；仍需以正式课表、容量及学院审核为准。&#x27;; }
  };
  const renderPool = (resetScroll=false) =&gt; {
    const query=el(&#x27;planner-search&#x27;).value.trim().toLowerCase(); const selected=new Set(selectedIds());
    const pool=courses.filter(c=&gt;!selected.has(c.id)&amp;&amp;!c.locked&amp;&amp;(filter===&#x27;all&#x27;||categoryKey(c)===filter)&amp;&amp;c.name.toLowerCase().includes(query));
    el(&#x27;planner-pool-count&#x27;).textContent=`${pool.length} 门可选`; const list=el(&#x27;planner-pool-list&#x27;); const priorScroll=resetScroll?0:list.scrollTop; list.innerHTML=&#x27;&#x27;;
    if(!pool.length) list.innerHTML=&#x27;&lt;div class=&quot;planner-empty&quot;&gt;没有符合条件的候选课&lt;/div&gt;&#x27;; else pool.forEach(c=&gt;list.appendChild(courseCard(c)));
    list.scrollTop=priorScroll;
    syncEditorHeights();
  };
  const renderTerms = () =&gt; [&#x27;autumn&#x27;,&#x27;spring&#x27;].forEach(term=&gt;{ const list=el(`planner-${term}`); list.innerHTML=&#x27;&#x27;; state[term].forEach(id=&gt;list.appendChild(courseCard(byId.get(id),term))); el(`planner-${term}-total`).textContent=`${fmt(state[term].reduce((s,id)=&gt;s+byId.get(id).credit,0))} 学分`; });
  const updateWeekStepButtons = () =&gt; {
    const chosen=el(&#x27;planner-week&#x27;).value;const week=chosen===&#x27;all&#x27;?null:Number(chosen);
    el(&#x27;planner-week-prev&#x27;).disabled=week===null||week&lt;=1;
    el(&#x27;planner-week-next&#x27;).disabled=week!==null&amp;&amp;week&gt;=17;
  };
  const stepWeek = direction =&gt; {
    const select=el(&#x27;planner-week&#x27;);const current=select.value===&#x27;all&#x27;?null:Number(select.value);
    if(current===null){if(direction&lt;0)return;select.value=&#x27;1&#x27;;}
    else {const next=current+direction;if(next&lt;1||next&gt;17)return;select.value=String(next);}
    renderWeek();select.focus();
  };
  const renderWeek = () =&gt; {
    const term=el(&#x27;planner-term-view&#x27;).value; const chosen=el(&#x27;planner-week&#x27;).value; const week=chosen===&#x27;all&#x27;?null:Number(chosen); const grid=el(&#x27;planner-week-grid&#x27;); grid.innerHTML=&#x27;&#x27;;
    updateWeekStepButtons();
    const mobile=plannerMobileMedia.matches;
    const heads=mobile?[&#x27;节&#x27;,&#x27;一&#x27;,&#x27;二&#x27;,&#x27;三&#x27;,&#x27;四&#x27;,&#x27;五&#x27;]:[&#x27;节次&#x27;,&#x27;周一&#x27;,&#x27;周二&#x27;,&#x27;周三&#x27;,&#x27;周四&#x27;,&#x27;周五&#x27;]; heads.forEach((h,i)=&gt;{const d=document.createElement(&#x27;div&#x27;);d.className=&#x27;week-cell week-head&#x27;;d.style.gridColumn=i+1;d.style.gridRow=1;d.textContent=h;grid.appendChild(d);});
    for(let p=1;p&lt;=11;p++){const label=document.createElement(&#x27;div&#x27;);label.className=&#x27;week-cell week-period&#x27;;label.style.gridColumn=1;label.style.gridRow=p+1;label.textContent=mobile?String(p):`第${p}节`;grid.appendChild(label);for(let day=1;day&lt;=5;day++){const cell=document.createElement(&#x27;div&#x27;);cell.className=&#x27;week-cell&#x27;;cell.style.gridColumn=day+1;cell.style.gridRow=p+1;grid.appendChild(cell);}}
    const pending=[];
    state[term].forEach(id=&gt;{ const course=byId.get(id); const meetings=getMeetings(id); if(!meetings.length){pending.push(course.name);return;} const active=meetings.filter(m=&gt;week===null||m.weeks.includes(week));mergeMeetingGroups(active).forEach(group=&gt;{ const item=document.createElement(&#x27;div&#x27;);item.className=`week-event type-${courseColorKey(course)}`;item.style.gridColumn=group.day+1;item.style.gridRow=`${group.start+1} / ${group.end+2}`;const rules=meetingRuleLines(group.meetings,week);const teacher=course.teacher||getSection(id)?.teacher||&#x27;教师待定&#x27;;const rulesText=rules.join(&#x27;；&#x27;);item.title=`${course.name} · ${course.category} · ${teacher} · ${group.room} · ${rulesText}`;item.setAttribute(&#x27;aria-label&#x27;,item.title);const rulesHtml=`&lt;small class=&quot;week-event-rules&quot;&gt;${rules.map(rule=&gt;`&lt;span&gt;${rule}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/small&gt;`;item.innerHTML=mobile?`&lt;strong&gt;${course.name}&lt;/strong&gt;&lt;small class=&quot;week-event-room&quot;&gt;${group.room}&lt;/small&gt;${rulesHtml}`:`&lt;span class=&quot;week-event-category&quot;&gt;${course.category}&lt;/span&gt;&lt;strong&gt;${course.name}&lt;/strong&gt;&lt;small&gt;${teacher} · ${group.room}&lt;/small&gt;${rulesHtml}`;grid.appendChild(item);}); });
    el(&#x27;planner-pending&#x27;).textContent=pending.length?`${termName(term)}待发布/待选教学班：${pending.join(&#x27;、&#x27;)}`:`${termName(term)}当前课程均已有可显示的教学时间。`;
  };
  const render = () =&gt; { renderMetrics(); renderPool(); renderTerms(); renderWeek(); renderCreditMap(); syncEditorHeights(); };
  const setup = () =&gt; {
    const filterDefs=[[&#x27;all&#x27;,&#x27;全部&#x27;],[&#x27;pro&#x27;,&#x27;专业选修&#x27;],[&#x27;other&#x27;,&#x27;其他选修&#x27;],[&#x27;quality&#x27;,&#x27;素质教育&#x27;]];
    filterDefs.forEach(([key,label])=&gt;{const btn=document.createElement(&#x27;button&#x27;);btn.type=&#x27;button&#x27;;btn.className=&#x27;planner-filter&#x27;;btn.textContent=label;btn.setAttribute(&#x27;aria-pressed&#x27;,key===filter?&#x27;true&#x27;:&#x27;false&#x27;);btn.addEventListener(&#x27;click&#x27;,()=&gt;{filter=key;document.querySelectorAll(&#x27;.planner-filter&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,b===btn?&#x27;true&#x27;:&#x27;false&#x27;));renderPool(true);});el(&#x27;planner-filters&#x27;).appendChild(btn);});
    el(&#x27;planner-search&#x27;).addEventListener(&#x27;input&#x27;,()=&gt;renderPool(true));
    el(&#x27;planner-pool-list&#x27;).addEventListener(&#x27;scroll&#x27;,updatePoolScrollHint,{passive:true});
    el(&#x27;planner-week&#x27;).innerHTML=&#x27;&lt;option value=&quot;all&quot;&gt;全部周次&lt;/option&gt;&#x27;+range(1,17).map(w=&gt;`&lt;option value=&quot;${w}&quot;&gt;第 ${w} 周&lt;/option&gt;`).join(&#x27;&#x27;);
    el(&#x27;planner-week&#x27;).addEventListener(&#x27;change&#x27;,renderWeek); el(&#x27;planner-term-view&#x27;).addEventListener(&#x27;change&#x27;,renderWeek);
    el(&#x27;planner-week-prev&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;stepWeek(-1));el(&#x27;planner-week-next&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;stepWeek(1));
    if(plannerMobileMedia.addEventListener) plannerMobileMedia.addEventListener(&#x27;change&#x27;,renderWeek); else plannerMobileMedia.addListener(renderWeek);
    document.querySelectorAll(&#x27;.planner-dropzone&#x27;).forEach(zone=&gt;{
      zone.addEventListener(&#x27;dragover&#x27;,e=&gt;{e.preventDefault();const course=byId.get(draggedId||e.dataTransfer.getData(&#x27;text/plain&#x27;));const allowed=course?.terms.includes(zone.dataset.term);zone.classList.toggle(&#x27;is-over&#x27;,allowed);zone.classList.toggle(&#x27;is-denied&#x27;,!allowed);e.dataTransfer.dropEffect=allowed?&#x27;copy&#x27;:&#x27;none&#x27;;});
      zone.addEventListener(&#x27;dragleave&#x27;,()=&gt;zone.classList.remove(&#x27;is-over&#x27;,&#x27;is-denied&#x27;));
      zone.addEventListener(&#x27;drop&#x27;,e=&gt;{e.preventDefault();zone.classList.remove(&#x27;is-over&#x27;,&#x27;is-denied&#x27;);addCourse(e.dataTransfer.getData(&#x27;text/plain&#x27;)||draggedId,zone.dataset.term);});
    });
    el(&#x27;planner-reset&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{state=JSON.parse(JSON.stringify(preset));el(&#x27;planner-term-view&#x27;).value=&#x27;autumn&#x27;;el(&#x27;planner-week&#x27;).value=&#x27;all&#x27;;render();notify(&#x27;已恢复量化实证预设。&#x27;);});
    el(&#x27;planner-export&#x27;).addEventListener(&#x27;click&#x27;,async()=&gt;{const text=[&#x27;量化实证选课草稿&#x27;,...[&#x27;autumn&#x27;,&#x27;spring&#x27;].flatMap(term=&gt;[`${termName(term)}：`,...state[term].map(id=&gt;`- ${byId.get(id).name}（${fmt(byId.get(id).credit)}学分）`)])].join(&#x27;\n&#x27;);try{await navigator.clipboard.writeText(text);notify(&#x27;课程清单已复制。&#x27;);}catch{notify(&#x27;当前浏览器未允许剪贴板访问，请手动记录课程清单。&#x27;,true);}});
    window.addEventListener(&#x27;resize&#x27;,syncEditorHeights,{passive:true});
    render();
  };
  setup();
})();
