  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

  padding: 0;

  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);

.form-range:focus-visible::-moz-range-thumb {

  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {

  opacity: 0.4;
}

.btn:focus-visible {

      function activateAppView(viewId, moveToView = false) {
        appViewButtons.forEach(button =&gt; {
          const active = button.dataset.mfView === viewId;
          button.setAttribute(&#x27;aria-selected&#x27;, String(active));
          button.tabIndex = active ? 0 : -1;
        });
        Object.entries(appViews).forEach(([id, view]) =&gt; { view.hidden = id !== viewId; });

        }
      }

      function activateTab(tabId, moveToPanel = false) {
        tabButtons.forEach(button =&gt; {
          const active = button.dataset.mfTab === tabId;
          button.setAttribute(&#x27;aria-selected&#x27;, String(active));
          button.tabIndex = active ? 0 : -1;
        });
        tabPanels.forEach(panel =&gt; { panel.hidden = panel.dataset.mfTabPanel !== tabId; });
        if (moveToPanel) {
          const panel = tabPanels.find(item =&gt; item.dataset.mfTabPanel === tabId);

        compareBody.insertAdjacentHTML(&#x27;beforeend&#x27;, `&lt;tr data-plan-row=&quot;${plan.id}&quot;&gt;&lt;td&gt;&lt;strong&gt;${plan.name}&lt;/strong&gt;${plan.recommended ? &#x27; &lt;span class=&quot;viz-badge&quot;&gt;推荐&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/td&gt;&lt;td&gt;${plan.summary}&lt;/td&gt;&lt;td class=&quot;text-center text-nowrap&quot;&gt;${credits(plan.autumn)}学分&lt;/td&gt;&lt;td class=&quot;text-center text-nowrap&quot;&gt;${credits(plan.spring)}学分&lt;/td&gt;&lt;td&gt;${plan.fit}&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-plan-jump=&quot;${plan.id}&quot;&gt;查看方案&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`);
        selector.insertAdjacentHTML(&#x27;beforeend&#x27;, `&lt;button type=&quot;button&quot; class=&quot;btn${plan.recommended ? &#x27; btn-primary&#x27; : &#x27;&#x27;}&quot; data-plan=&quot;${plan.id}&quot; aria-pressed=&quot;${plan.recommended ? &#x27;true&#x27; : &#x27;false&#x27;}&quot;&gt;${plan.name}&lt;/button&gt;`);
      });

      function render(plan) {
        root.querySelector(&#x27;#mf-detail-title&#x27;).textContent = `${plan.name}方案`;
        root.querySelector(&#x27;#mf-detail-desc&#x27;).textContent = plan.desc;
        root.querySelector(&#x27;#mf-total-load&#x27;).textContent = `${credits(plan.autumn) + credits(plan.spring)} 学分课堂/实践课`;
        root.querySelector(&#x27;#mf-autumn-total&#x27;).textContent = `${credits(plan.autumn)}学分`;
        root.querySelector(&#x27;#mf-spring-total&#x27;).textContent = `${credits(plan.spring)}学分`;
        root.querySelector(&#x27;#mf-autumn-body&#x27;).innerHTML = plan.autumn.map(rowHtml).join(&#x27;&#x27;);
        root.querySelector(&#x27;#mf-spring-body&#x27;).innerHTML = plan.spring.map(rowHtml).join(&#x27;&#x27;);
        root.querySelector(&#x27;#mf-autumn-hours&#x27;).textContent = `${plan.autumnHours}学时 · ${(plan.autumnHours / 16).toFixed(1)}/周`;
        root.querySelector(&#x27;#mf-spring-hours&#x27;).textContent = `${plan.springHours}学时 · ${(plan.springHours / 16).toFixed(1)}/周`;
        root.querySelector(&#x27;#mf-autumn-bar&#x27;).style.width = `${plan.autumnHours / 280 * 100}%`;
        root.querySelector(&#x27;#mf-spring-bar&#x27;).style.width = `${plan.springHours / 280 * 100}%`;
        root.querySelector(&#x27;#mf-autumn-progress&#x27;).setAttribute(&#x27;aria-valuenow&#x27;, plan.autumnHours);
        root.querySelector(&#x27;#mf-spring-progress&#x27;).setAttribute(&#x27;aria-valuenow&#x27;, plan.springHours);
        root.querySelectorAll(&#x27;[data-plan]&#x27;).forEach(button =&gt; {
          const active = button.dataset.plan === plan.id;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
          button.classList.toggle(&#x27;btn-primary&#x27;, active);
        });
        root.querySelectorAll(&#x27;[data-plan-row]&#x27;).forEach(row =&gt; {
          row.classList.toggle(&#x27;is-current&#x27;, row.dataset.planRow === plan.id);
        });
        root.querySelectorAll(&#x27;[data-plan-jump]&#x27;).forEach(button =&gt; {
          const active = button.dataset.planJump === plan.id;
          button.classList.toggle(&#x27;btn-primary&#x27;, active);
          button.textContent = active ? &#x27;当前方案&#x27; : &#x27;查看方案&#x27;;
        });
        selectedFinalPlanId = plan.id;
        root.querySelectorAll(&#x27;[data-final-plan]&#x27;).forEach(button =&gt; {
          const active = button.dataset.finalPlan === plan.id;
          button.classList.toggle(&#x27;btn-primary&#x27;, active);
          button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
        });
        const finalResult = root.querySelector(&#x27;#mf-final-result&#x27;);
        if (finalResult &amp;&amp; !finalResult.hidden) generateFinalPlan();
      }

      root.addEventListener(&#x27;click&#x27;, event =&gt; {
        const button = event.target.closest(&#x27;[data-plan], [data-plan-jump]&#x27;);
        if (!button) return;
        const id = button.dataset.plan || button.dataset.planJump;
        const plan = plans.find(item =&gt; item.id === id);
        if (plan) {
          render(plan);
          if (button.dataset.planJump) {
            activateTab(&#x27;overview&#x27;);
            root.querySelector(&#x27;#mf-panel-courses&#x27;)?.scrollIntoView({ behavior: matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches ? &#x27;auto&#x27; : &#x27;smooth&#x27;, block: &#x27;start&#x27; });
          }
        }
      });

      const finalPlanOptions = root.querySelector(&#x27;#mf-final-plan-options&#x27;);
      const finalPolitics = root.querySelector(&#x27;#mf-final-politics&#x27;);
      const finalQualityOptions = root.querySelector(&#x27;#mf-final-quality-options&#x27;);
      const finalExtraOptions = root.querySelector(&#x27;#mf-final-extra-options&#x27;);
      let selectedFinalPlanId = plans[0].id;
      let currentFinalRows = [];
      let currentFinalPlanName = &#x27;&#x27;;
      let currentFinalView = &#x27;all&#x27;;
      const scheduleSemester = root.querySelector(&#x27;#mf-schedule-semester&#x27;);
      const scheduleWeek = root.querySelector(&#x27;#mf-schedule-week&#x27;);
      const weekPrev = root.querySelector(&#x27;#mf-week-prev&#x27;);
      const weekNext = root.querySelector(&#x27;#mf-week-next&#x27;);
      const englishSection = root.querySelector(&#x27;#mf-english-section&#x27;);
      const modernizationSection = root.querySelector(&#x27;#mf-modernization-section&#x27;);
      const aiSection = root.querySelector(&#x27;#mf-ai-section&#x27;);
      const ipSection = root.querySelector(&#x27;#mf-ip-section&#x27;);
      const sportsSection = root.querySelector(&#x27;#mf-sports-section&#x27;);
      const aiSectionControl = root.querySelector(&#x27;#mf-ai-section-control&#x27;);
      const ipSectionControl = root.querySelector(&#x27;#mf-ip-section-control&#x27;);
      const sportsSectionControl = root.querySelector(&#x27;#mf-sports-section-control&#x27;);
      const stressSectionControl = root.querySelector(&#x27;#mf-stress-section-control&#x27;);
      const weekGrid = root.querySelector(&#x27;#mf-week-grid&#x27;);
      const scheduleStatus = root.querySelector(&#x27;#mf-schedule-status&#x27;);
      const conflictBox = root.querySelector(&#x27;#mf-conflict-box&#x27;);
      const mobileScheduleMedia = matchMedia(&#x27;(max-width: 620px)&#x27;);

      scheduleWeek.innerHTML = `&lt;option value=&quot;all&quot;&gt;整个学期&lt;/option&gt;${Array.from({ length: 16 }, (_, index) =&gt; `&lt;option value=&quot;${index + 1}&quot;&gt;第${index + 1}周&lt;/option&gt;`).join(&#x27;&#x27;)}`;
      englishSection.innerHTML = englishSections.map(section =&gt; `&lt;option value=&quot;${section.id}&quot;&gt;${section.label}&lt;/option&gt;`).join(&#x27;&#x27;);
      modernizationSection.innerHTML = modernizationSections.map(section =&gt; `&lt;option value=&quot;${section.id}&quot;&gt;${section.label}&lt;/option&gt;`).join(&#x27;&#x27;);
      aiSection.innerHTML = aiSections.map(section =&gt; `&lt;option value=&quot;${section.id}&quot;&gt;${section.label}&lt;/option&gt;`).join(&#x27;&#x27;);
      ipSection.innerHTML = ipSections.map(section =&gt; `&lt;option value=&quot;${section.id}&quot;&gt;${section.label}&lt;/option&gt;`).join(&#x27;&#x27;);
      sportsSection.innerHTML = sportsSections.map(section =&gt; `&lt;option value=&quot;${section.id}&quot;&gt;${section.label}&lt;/option&gt;`).join(&#x27;&#x27;);

      finalPlanOptions.innerHTML = plans.map((plan, index) =&gt; `&lt;button type=&quot;button&quot; class=&quot;btn${index === 0 ? &#x27; btn-primary&#x27; : &#x27;&#x27;}&quot; data-final-plan=&quot;${plan.id}&quot; aria-pressed=&quot;${index === 0 ? &#x27;true&#x27; : &#x27;false&#x27;}&quot;&gt;${plan.name}&lt;/button&gt;`).join(&#x27;&#x27;);
      finalPolitics.innerHTML = politicsCourses.map(course =&gt; `&lt;option value=&quot;${course}&quot;&gt;${course}&lt;/option&gt;`).join(&#x27;&#x27;);
      finalQualityOptions.innerHTML = qualityCourses.map(course =&gt; `&lt;div class=&quot;mf-choice-row&quot;&gt;&lt;div class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;mf-quality-${course.id}&quot; data-quality=&quot;${course.id}&quot; checked&gt;&lt;label class=&quot;form-check-label&quot; for=&quot;mf-quality-${course.id}&quot;&gt;${course.name} · ${course.credits}学分 · ${course.opening} · 考查 · ${course.scheduleNote}&lt;/label&gt;&lt;/div&gt;&lt;label class=&quot;sr-only&quot; for=&quot;mf-quality-term-${course.id}&quot;&gt;${course.name}安排学期&lt;/label&gt;&lt;select class=&quot;form-select&quot; id=&quot;mf-quality-term-${course.id}&quot; data-quality-term=&quot;${course.id}&quot;&gt;&lt;option value=&quot;秋季&quot; selected&gt;秋季&lt;/option&gt;&lt;option value=&quot;春季&quot;&gt;春季&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      finalExtraOptions.innerHTML = extraCourses.map(course =&gt; {
        const selector = course.flexible ? `&lt;label class=&quot;sr-only&quot; for=&quot;mf-extra-term-${course.id}&quot;&gt;${course.name}安排学期&lt;/label&gt;&lt;select class=&quot;form-select&quot; id=&quot;mf-extra-term-${course.id}&quot; data-extra-term=&quot;${course.id}&quot; disabled&gt;&lt;option value=&quot;秋季&quot;&gt;秋季&lt;/option&gt;&lt;option value=&quot;春季&quot; selected&gt;春季&lt;/option&gt;&lt;/select&gt;` : &#x27;&#x27;;
        return `&lt;div class=&quot;mf-choice-row&quot;&gt;&lt;div class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;mf-extra-${course.id}&quot; data-extra=&quot;${course.id}&quot;&gt;&lt;label class=&quot;form-check-label&quot; for=&quot;mf-extra-${course.id}&quot;&gt;${course.name} · ${course.credits}学分 · ${course.opening} · ${assessmentByCourse[course.name]} · ${course.scheduleNote}&lt;/label&gt;&lt;/div&gt;${selector}&lt;/div&gt;`;
      }).join(&#x27;&#x27;);

      const finalTagHtml = category =&gt; `&lt;span class=&quot;mf-type-tag mf-type-${categoryColor(category)}&quot;&gt;${category}&lt;/span&gt;`;
      const finalRowHtml = row =&gt; `&lt;tr&gt;&lt;td class=&quot;text-nowrap&quot;&gt;${row[0]}&lt;/td&gt;&lt;td&gt;${row[1]}&lt;/td&gt;&lt;td&gt;${finalTagHtml(row[2])}&lt;/td&gt;&lt;td class=&quot;text-nowrap&quot;&gt;${row[3]}&lt;/td&gt;&lt;td class=&quot;text-nowrap&quot;&gt;${assessmentByCourse[row[1]] || &#x27;考查&#x27;}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${row[4]}&lt;/td&gt;&lt;/tr&gt;`;
      const finalSemesterRowHtml = row =&gt; `&lt;tr&gt;&lt;td&gt;${row[1]}&lt;/td&gt;&lt;td&gt;${finalTagHtml(row[2])}&lt;/td&gt;&lt;td class=&quot;text-nowrap&quot;&gt;${row[3]}&lt;/td&gt;&lt;td class=&quot;text-nowrap&quot;&gt;${assessmentByCourse[row[1]] || &#x27;考查&#x27;}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${row[4]}&lt;/td&gt;&lt;/tr&gt;`;

      function selectedExtras() {
        return extraCourses.filter(course =&gt; root.querySelector(`[data-extra=&quot;${course.id}&quot;]`).checked).map(course =&gt; {
          const termControl = root.querySelector(`[data-extra-term=&quot;${course.id}&quot;]`);
          return { ...course, term: termControl ? termControl.value : course.term };
        });
      }

      function selectedQualityCourses() {
        return qualityCourses.filter(course =&gt; root.querySelector(`[data-quality=&quot;${course.id}&quot;]`).checked).map(course =&gt; ({
          ...course,
          term: root.querySelector(`[data-quality-term=&quot;${course.id}&quot;]`).value
        }));
      }

      const meetingRunsInWeek = (meeting, week) =&gt; meeting.weeks.some(range =&gt; week &gt;= range[0] &amp;&amp; week &lt;= range[1]);
      const periodsOverlap = (a, b) =&gt; a.start &lt;= b.end &amp;&amp; b.start &lt;= a.end;
      const rangesText = weeks =&gt; weeks.map(range =&gt; range[0] === range[1] ? `${range[0]}周` : `${range[0]}-${range[1]}周`).join(&#x27;、&#x27;);
      const overlappingWeekRanges = (a, b) =&gt; a.weeks.flatMap(left =&gt; b.weeks.map(right =&gt; [Math.max(left[0], right[0]), Math.min(left[1], right[1])])).filter(range =&gt; range[0] &lt;= range[1]);
      const visualItemKey = item =&gt; [item.course, item.category, item.code, item.teacher, item.meeting.day, item.meeting.room].join(&#x27;|&#x27;);

      function mergeDisplayItems(items, conflictItems) {
        const groups = new Map();
        items.forEach(item =&gt; {
          const key = visualItemKey(item);
          if (!groups.has(key)) groups.set(key, { ...item, meetings: [], sourceItems: [] });
          groups.get(key).meetings.push(item.meeting);
          groups.get(key).sourceItems.push(item);
        });
        return [...groups.values()].map(item =&gt; ({
          ...item,
          start: Math.min(...item.meetings.map(meeting =&gt; meeting.start)),
          end: Math.max(...item.meetings.map(meeting =&gt; meeting.end)),
          conflict: item.sourceItems.some(source =&gt; conflictItems.has(source))
        }));
      }

      function assignDisplayLanes(items) {
        const sorted = [...items].sort((a, b) =&gt; a.start - b.start || a.end - b.end || a.course.localeCompare(b.course, &#x27;zh-CN&#x27;));
        const hasVisualOverlap = item =&gt; sorted.some(other =&gt; other !== item &amp;&amp; periodsOverlap(item, other));
        const laneEnds = [];
        sorted.forEach(item =&gt; {
          if (!hasVisualOverlap(item)) {
            item.fullWidth = true;
            item.lane = 0;
            return;
          }
          let lane = laneEnds.findIndex(end =&gt; item.start &gt; end);
          if (lane === -1) lane = laneEnds.length;
          laneEnds[lane] = item.end;
          item.fullWidth = false;
          item.lane = lane;
        });
        return { items: sorted, laneCount: Math.max(1, laneEnds.length) };
      }

      function updateWeekNavigation() {
        const wholeSemester = scheduleWeek.value === &#x27;all&#x27;;
        const week = Number(scheduleWeek.value || 0);
        weekPrev.disabled = wholeSemester || week &lt;= 1;
        weekNext.disabled = !wholeSemester &amp;&amp; week &gt;= 16;
      }

      function renderWeekSchedule() {
        updateWeekNavigation();
        const semester = scheduleSemester.value;
        const wholeSemester = scheduleWeek.value === &#x27;all&#x27;;
        const week = Number(scheduleWeek.value || 1);
        const mobileTimetable = mobileScheduleMedia.matches;
        const days = mobileTimetable
          ? [&#x27;一&#x27;, &#x27;二&#x27;, &#x27;三&#x27;, &#x27;四&#x27;, &#x27;五&#x27;, &#x27;六&#x27;, &#x27;日&#x27;]
          : [&#x27;星期一&#x27;, &#x27;星期二&#x27;, &#x27;星期三&#x27;, &#x27;星期四&#x27;, &#x27;星期五&#x27;];
        const autumnCourseNames = new Set(currentFinalRows.filter(row =&gt; row[0] === &#x27;秋季&#x27;).map(row =&gt; row[1]));
        aiSectionControl.hidden = scheduleSemester.value !== &#x27;autumn&#x27; || !autumnCourseNames.has(&#x27;人工智能与机器学习&#x27;);
        ipSectionControl.hidden = scheduleSemester.value !== &#x27;autumn&#x27; || !autumnCourseNames.has(&#x27;知识产权与信息检索&#x27;);
        sportsSectionControl.hidden = scheduleSemester.value !== &#x27;autumn&#x27; || !autumnCourseNames.has(&#x27;体育技能、欣赏与文化&#x27;);
        stressSectionControl.hidden = scheduleSemester.value !== &#x27;autumn&#x27; || !autumnCourseNames.has(&#x27;压力管理的艺术&#x27;);

        if (semester === &#x27;spring&#x27;) {
          scheduleStatus.innerHTML = `&lt;div class=&quot;mf-status-line&quot;&gt;&lt;span class=&quot;mf-status-mark is-pending&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;2027春季课表尚未发布。&lt;/strong&gt;课程清单可以按春季查看，但当前不能做可靠冲突判断。&lt;/span&gt;&lt;/div&gt;`;
          weekGrid.innerHTML = `&lt;div class=&quot;mf-week-empty&quot;&gt;等待学校发布春季教学班周次与节次&lt;/div&gt;`;
          conflictBox.classList.remove(&#x27;has-conflict&#x27;);
          conflictBox.textContent = &#x27;春季排课未发布：不把“尚无数据”解释成“没有冲突”。&#x27;;
          return;
        }

        const scheduled = [];
        const courseCategories = new Map(currentFinalRows.map(row =&gt; [row[1], row[2]]));
        Object.entries(verifiedSchedules).forEach(([course, detail]) =&gt; {
          if (!autumnCourseNames.has(course)) return;
          detail.meetings.forEach(meeting =&gt; scheduled.push({ course, category: courseCategories.get(course) || &#x27;专业基础&#x27;, code: detail.code, teacher: detail.teacher, meeting }));
        });
        const selectedEnglish = englishSections.find(section =&gt; section.id === englishSection.value) || englishSections[0];
        if (autumnCourseNames.has(&#x27;硕士研究生英语&#x27;) &amp;&amp; selectedEnglish.id !== &#x27;none&#x27;) {
          selectedEnglish.meetings.forEach(meeting =&gt; scheduled.push({ course: &#x27;硕士研究生英语&#x27;, category: &#x27;公共基础&#x27;, code: &#x27;1700005008&#x27;, teacher: selectedEnglish.label.split(&#x27; · &#x27;).pop().replace(&#x27;（冲突）&#x27;, &#x27;&#x27;), meeting }));
        }
        const selectedModernization = modernizationSections.find(section =&gt; section.id === modernizationSection.value) || modernizationSections[0];
        if (autumnCourseNames.has(&#x27;中国式现代化的理论与实践&#x27;) &amp;&amp; selectedModernization.id !== &#x27;none&#x27;) {
          selectedModernization.meetings.forEach(meeting =&gt; scheduled.push({ course: &#x27;中国式现代化的理论与实践&#x27;, category: &#x27;公共基础&#x27;, code: &#x27;1800005008&#x27;, teacher: selectedModernization.label.split(&#x27; · &#x27;).pop().replace(&#x27;（冲突）&#x27;, &#x27;&#x27;), meeting }));
        }
        const selectedAi = aiSections.find(section =&gt; section.id === aiSection.value) || aiSections[0];
        if (autumnCourseNames.has(&#x27;人工智能与机器学习&#x27;) &amp;&amp; selectedAi.id !== &#x27;none&#x27;) {
          selectedAi.meetings.forEach(meeting =&gt; scheduled.push({ course: &#x27;人工智能与机器学习&#x27;, category: &#x27;其他选修·加选&#x27;, code: &#x27;1512016010&#x27;, teacher: selectedAi.teacher, meeting }));
        }
        const selectedIp = ipSections.find(section =&gt; section.id === ipSection.value) || ipSections[0];
        if (autumnCourseNames.has(&#x27;知识产权与信息检索&#x27;) &amp;&amp; selectedIp.id !== &#x27;none&#x27;) {
          selectedIp.meetings.forEach(meeting =&gt; scheduled.push({ course: &#x27;知识产权与信息检索&#x27;, category: &#x27;其他选修·加选&#x27;, code: &#x27;1500005004&#x27;, teacher: selectedIp.teacher, meeting }));
        }
        const sportsValue = sportsSection.value;
        sportsSections.forEach(section =&gt; {
          const option = [...sportsSection.options].find(item =&gt; item.value === section.id);
          if (!option) return;
          const hasConflict = section.id !== &#x27;none&#x27; &amp;&amp; section.meetings.some(meeting =&gt;
            scheduled.some(item =&gt;
              meeting.day === item.meeting.day
              &amp;&amp; periodsOverlap(meeting, item.meeting)
              &amp;&amp; overlappingWeekRanges(meeting, item.meeting).length
            )
          );
          option.textContent = `${section.label}${hasConflict ? &#x27;（冲突）&#x27; : &#x27;&#x27;}`;
        });
        sportsSection.value = sportsValue;
        const selectedSports = sportsSections.find(section =&gt; section.id === sportsSection.value) || sportsSections[0];
        if (autumnCourseNames.has(&#x27;体育技能、欣赏与文化&#x27;) &amp;&amp; selectedSports.id !== &#x27;none&#x27;) {
          selectedSports.meetings.forEach(meeting =&gt; scheduled.push({ course: &#x27;体育技能、欣赏与文化&#x27;, category: &#x27;必修环节·素质教育&#x27;, code: &#x27;2000025001&#x27;, teacher: selectedSports.teacher, meeting }));
        }
        const active = wholeSemester ? scheduled : scheduled.filter(item =&gt; meetingRunsInWeek(item.meeting, week));
        const conflictPairs = [];
        active.forEach((item, index) =&gt; active.slice(index + 1).forEach(other =&gt; {
          const overlappingWeeks = overlappingWeekRanges(item.meeting, other.meeting);
          if (item.meeting.day === other.meeting.day &amp;&amp; periodsOverlap(item.meeting, other.meeting) &amp;&amp; (!wholeSemester || overlappingWeeks.length)) conflictPairs.push({ items: [item, other], overlappingWeeks });
        }));
        const conflictItems = new Set(conflictPairs.flatMap(pair =&gt; pair.items));

        const periodSlots = Array.from({ length: 11 }, (_, index) =&gt; `&lt;div class=&quot;mf-period-slot&quot; style=&quot;grid-row:${index + 1}&quot;&gt;${mobileTimetable ? index + 1 : `第${index + 1}节`}&lt;/div&gt;`).join(&#x27;&#x27;);
        let gridHtml = `&lt;div class=&quot;mf-week-cell mf-week-head&quot;&gt;节次&lt;/div&gt;${days.map(day =&gt; `&lt;div class=&quot;mf-week-cell mf-week-head&quot;&gt;${day}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;mf-period-track&quot;&gt;${periodSlots}&lt;/div&gt;`;
        days.forEach((_, dayIndex) =&gt; {
          const dayItems = mergeDisplayItems(active.filter(item =&gt; item.meeting.day === dayIndex + 1), conflictItems);
          const layout = assignDisplayLanes(dayItems);
          const backgroundSlots = Array.from({ length: 11 }, (_, index) =&gt; `&lt;div class=&quot;mf-period-slot&quot; style=&quot;grid-row:${index + 1}&quot;&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
          const chips = layout.items.map(item =&gt; {
            const scheduleRules = [...new Set(item.meetings.map(meeting =&gt; `${meeting.start}-${meeting.end}节 · ${rangesText(meeting.weeks)}`))];
            const scheduleLines = scheduleRules.join(&#x27;；&#x27;);
            const mobileWeekRules = [...new Set(item.meetings.map(meeting =&gt; rangesText(meeting.weeks)))];
            const scheduleHtml = (mobileTimetable ? mobileWeekRules : scheduleRules).map(rule =&gt; `&lt;span&gt;${rule}&lt;/span&gt;`).join(&#x27;&#x27;);
            const column = item.fullWidth ? &#x27;1 / -1&#x27; : String(item.lane + 1);
            return `&lt;div class=&quot;mf-class-chip mf-course-color mf-type-${categoryColor(item.category)}${item.conflict ? &#x27; is-conflict&#x27; : &#x27;&#x27;}&quot; style=&quot;grid-row:${item.start}/${item.end + 1};grid-column:${column}&quot; title=&quot;${item.course} · ${item.category} · ${item.teacher} · ${item.meeting.room} · ${scheduleLines} · ${item.code}&quot;&gt;&lt;span class=&quot;mf-class-head&quot;&gt;&lt;span class=&quot;mf-class-badges&quot;&gt;&lt;span class=&quot;mf-class-category&quot;&gt;${item.category}&lt;/span&gt;${item.conflict ? &#x27;&lt;span class=&quot;mf-conflict-badge&quot;&gt;冲突&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/span&gt;&lt;strong&gt;${item.course}&lt;/strong&gt;&lt;/span&gt;&lt;span class=&quot;mf-class-meta&quot;&gt;&lt;span class=&quot;mf-class-teacher&quot;&gt;${item.teacher}&lt;/span&gt;&lt;span class=&quot;mf-class-room&quot;&gt;${item.meeting.room}&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;mf-class-schedule&quot;&gt;${scheduleHtml}&lt;/span&gt;&lt;/div&gt;`;
          }).join(&#x27;&#x27;);
          gridHtml += `&lt;div class=&quot;mf-day-track&quot; style=&quot;--mf-lanes:${layout.laneCount}&quot;&gt;${backgroundSlots}${chips}&lt;/div&gt;`;
        });
        weekGrid.innerHTML = gridHtml;

        const publishedCourses = [...new Set(scheduled.map(item =&gt; item.course))];
        const pendingCourses = [...autumnCourseNames].filter(name =&gt; !publishedCourses.includes(name));
        scheduleStatus.innerHTML = `&lt;div class=&quot;mf-status-line&quot;&gt;&lt;span class=&quot;mf-status-mark&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;已纳入${publishedCourses.length}门：</strong&gt;${publishedCourses.length ? publishedCourses.join(&#x27;、&#x27;) : &#x27;尚未选择已发布教学班&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;mf-status-line&quot;&gt;&lt;span class=&quot;mf-status-mark is-pending&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;待发布或待选班${pendingCourses.length}门：</strong&gt;${pendingCourses.length ? pendingCourses.join(&#x27;、&#x27;) : &#x27;无&#x27;}&lt;/span&gt;&lt;/div&gt;`;
        conflictBox.classList.toggle(&#x27;has-conflict&#x27;, conflictPairs.length &gt; 0);
        const scopeLabel = wholeSemester ? &#x27;整个学期&#x27; : `第${week}周`;
        conflictBox.innerHTML = conflictPairs.length ? `&lt;strong&gt;${scopeLabel}发现${conflictPairs.length}组冲突：&lt;/strong&gt;${conflictPairs.map(pair =&gt; { const [first, second] = pair.items; const weeksLabel = wholeSemester ? `，${rangesText(pair.overlappingWeeks)}` : &#x27;&#x27;; return `${first.course} 与 ${second.course}（星期${&#x27;一二三四五六日&#x27;[first.meeting.day - 1]}第${Math.max(first.meeting.start, second.meeting.start)}-${Math.min(first.meeting.end, second.meeting.end)}节${weeksLabel}）`; }).join(&#x27;；&#x27;)}` : `&lt;strong&gt;${scopeLabel}未发现已发布课程之间的时间冲突。&lt;/strong&gt; 待发布课程仍不计入此结论。`;
      }

      function renderFinalView(view) {
        currentFinalView = view;
        const autumnRows = currentFinalRows.filter(row =&gt; row[0] === &#x27;秋季&#x27;);
        const springRows = currentFinalRows.filter(row =&gt; row[0] === &#x27;春季&#x27;);
        const requiredRows = currentFinalRows.filter(row =&gt; row[0] === &#x27;培养环节&#x27;);
        const sumRows = rows =&gt; rows.reduce((sum, row) =&gt; sum + row[4], 0);
        const total = sumRows(currentFinalRows);
        const courseCredits = sumRows(currentFinalRows.filter(row =&gt; row[2] !== &#x27;实践教学&#x27; &amp;&amp; !row[2].startsWith(&#x27;必修环节&#x27;)));
        const practiceCredits = sumRows(currentFinalRows.filter(row =&gt; row[2] === &#x27;实践教学&#x27;));
        const requiredCredits = sumRows(currentFinalRows.filter(row =&gt; row[2].startsWith(&#x27;必修环节&#x27;)));
        const assessmentDetail = rows =&gt; {
          const exams = rows.filter(row =&gt; (assessmentByCourse[row[1]] || &#x27;考查&#x27;) === &#x27;考试&#x27;).length;
          return `${rows.length}门 · 考试${exams}＋考查${rows.length - exams}`;
        };
        const semesterView = view === &#x27;semester&#x27;;
        const weekView = view === &#x27;week&#x27;;
        root.querySelector(&#x27;#mf-final-title&#x27;).textContent = semesterView ? `${currentFinalPlanName}最终方案 · 春秋两栏` : weekView ? `${currentFinalPlanName}最终方案 · 星期课表` : `${currentFinalPlanName}基础上的最终方案`;
        root.querySelector(&#x27;#mf-final-credit-total&#x27;).textContent = `总计 ${total} 学分`;
        root.querySelector(&#x27;#mf-final-table-view&#x27;).hidden = semesterView || weekView;
        root.querySelector(&#x27;#mf-final-semester-view&#x27;).hidden = !semesterView;
        root.querySelector(&#x27;#mf-final-week-view&#x27;).hidden = !weekView;
        root.querySelector(&#x27;#mf-final-body&#x27;).innerHTML = currentFinalRows.map(finalRowHtml).join(&#x27;&#x27;);
        root.querySelector(&#x27;#mf-final-autumn-body&#x27;).innerHTML = autumnRows.map(finalSemesterRowHtml).join(&#x27;&#x27;);
        root.querySelector(&#x27;#mf-final-spring-body&#x27;).innerHTML = springRows.map(finalSemesterRowHtml).join(&#x27;&#x27;);
        root.querySelector(&#x27;#mf-final-required-body&#x27;).innerHTML = requiredRows.map(finalSemesterRowHtml).join(&#x27;&#x27;);
        root.querySelector(&#x27;#mf-final-autumn-total&#x27;).textContent = `${sumRows(autumnRows)}学分`;
        root.querySelector(&#x27;#mf-final-spring-total&#x27;).textContent = `${sumRows(springRows)}学分`;
        root.querySelector(&#x27;#mf-final-required-total&#x27;).textContent = `${sumRows(requiredRows)}学分`;
        root.querySelector(&#x27;#mf-final-stat-total&#x27;).textContent = total;
        root.querySelector(&#x27;#mf-final-stat-breakdown&#x27;).textContent = `课程${courseCredits}＋实践${practiceCredits}＋必修${requiredCredits}`;
        root.querySelector(&#x27;#mf-final-stat-autumn&#x27;).textContent = `${sumRows(autumnRows)}学分`;
        root.querySelector(&#x27;#mf-final-stat-autumn-detail&#x27;).textContent = assessmentDetail(autumnRows);
        root.querySelector(&#x27;#mf-final-stat-spring&#x27;).textContent = `${sumRows(springRows)}学分`;
        root.querySelector(&#x27;#mf-final-stat-spring-detail&#x27;).textContent = assessmentDetail(springRows);
        root.querySelectorAll(&#x27;[data-final-view]&#x27;).forEach(button =&gt; {
          const active = button.dataset.finalView === view;
          button.classList.toggle(&#x27;btn-primary&#x27;, active);
          button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
        });
        if (weekView) renderWeekSchedule();
      }

      function generateFinalPlan() {
        const plan = plans.find(item =&gt; item.id === selectedFinalPlanId) || plans[0];
        const politics = finalPolitics.value;
        const practice = root.querySelector(&#x27;input[name=&quot;mf-final-practice&quot;]:checked&#x27;).value;
        const extras = selectedExtras();
        const quality = selectedQualityCourses();
        const rows = [];

        plan.autumn.forEach(course =&gt; rows.push([&#x27;秋季&#x27;, course[0], course[1], termByCourse[course[0]], course[2]]));
        extras.filter(course =&gt; course.term === &#x27;秋季&#x27;).forEach(course =&gt; rows.push([&#x27;秋季&#x27;, course.name, &#x27;其他选修·加选&#x27;, course.opening, course.credits]));
        quality.filter(course =&gt; course.term === &#x27;秋季&#x27;).forEach(course =&gt; rows.push([&#x27;秋季&#x27;, course.name, &#x27;必修环节·素质教育&#x27;, course.opening, course.credits]));
        plan.spring.forEach(course =&gt; {
          const name = course[0] === &#x27;思政课程三选一&#x27; ? politics : course[0];
          rows.push([&#x27;春季&#x27;, name, course[1], termByCourse[name], course[2]]);
        });
        extras.filter(course =&gt; course.term === &#x27;春季&#x27;).forEach(course =&gt; rows.push([&#x27;春季&#x27;, course.name, &#x27;其他选修·加选&#x27;, course.opening, course.credits]));
        quality.filter(course =&gt; course.term === &#x27;春季&#x27;).forEach(course =&gt; rows.push([&#x27;春季&#x27;, course.name, &#x27;必修环节·素质教育&#x27;, course.opening, course.credits]));
        rows.push([&#x27;培养环节&#x27;, requiredLinks[0][0], requiredLinks[0][1], requiredLinks[0][3], requiredLinks[0][2]]);
        rows.push([&#x27;培养环节&#x27;, practice, &#x27;必修环节&#x27;, &#x27;培养期内&#x27;, 1]);
        requiredLinks.slice(1).filter(item =&gt; item[0] !== &#x27;素质教育公选课&#x27;).forEach(item =&gt; rows.push([&#x27;培养环节&#x27;, item[0], item[1], item[3], item[2]]));

        const extraCredits = extras.reduce((sum, course) =&gt; sum + course.credits, 0);
        const qualityCredits = quality.reduce((sum, course) =&gt; sum + course.credits, 0);
        if (qualityCredits &lt; 1) rows.push([&#x27;培养环节&#x27;, &#x27;素质教育公选课（待选）&#x27;, &#x27;必修环节&#x27;, &#x27;培养期内&#x27;, 1]);
        currentFinalRows = rows;
        currentFinalPlanName = plan.name;
        root.querySelector(&#x27;#mf-final-summary&#x27;).textContent = `思政：${politics}；必修环节：${practice}；素质教育：${quality.length ? quality.map(course =&gt; course.name).join(&#x27;、&#x27;) : &#x27;尚未选课&#x27;}；额外其他选修：${extras.length ? extras.map(course =&gt; course.name).join(&#x27;、&#x27;) : &#x27;不加选&#x27;}`;
        const additionalCredits = extraCredits + Math.max(0, qualityCredits - 1);
        root.querySelector(&#x27;#mf-final-check&#x27;).textContent = qualityCredits &lt; 1 ? &#x27;仍需选择至少1学分素质教育公选课；当前以1学分待选项保留最低培养要求。&#x27; : additionalCredits ? `满足最低38学分要求，并在最低方案上增加${additionalCredits}学分。` : &#x27;按最低38学分生成，培养方案各类别要求完整。&#x27;;
        root.querySelector(&#x27;#mf-final-empty&#x27;).hidden = true;
        root.querySelector(&#x27;#mf-final-result&#x27;).hidden = false;
        renderFinalView(currentFinalView);
      }

      root.addEventListener(&#x27;click&#x27;, event =&gt; {
        const weekStepButton = event.target.closest(&#x27;#mf-week-prev, #mf-week-next&#x27;);
        if (weekStepButton) {
          const currentWeek = scheduleWeek.value === &#x27;all&#x27; ? 0 : Number(scheduleWeek.value);
          const nextWeek = weekStepButton === weekNext ? Math.min(16, currentWeek + 1) : Math.max(1, currentWeek - 1);
          scheduleWeek.value = String(nextWeek);
          renderWeekSchedule();
          return;
        }
        const finalPlanButton = event.target.closest(&#x27;[data-final-plan]&#x27;);
        if (finalPlanButton) {
          const plan = plans.find(item =&gt; item.id === finalPlanButton.dataset.finalPlan);
          if (plan) render(plan);
        }
        const finalViewButton = event.target.closest(&#x27;[data-final-view]&#x27;);
        if (finalViewButton) renderFinalView(finalViewButton.dataset.finalView);
        if (event.target.closest(&#x27;#mf-generate-final&#x27;)) {
          generateFinalPlan();
          activateTab(&#x27;final&#x27;, true);
        }
      });

      root.addEventListener(&#x27;change&#x27;, event =&gt; {
        if (event.target.closest(&#x27;#mf-schedule-semester, #mf-schedule-week, #mf-english-section, #mf-modernization-section, #mf-ai-section, #mf-ip-section, #mf-sports-section&#x27;)) {
          renderWeekSchedule();
          return;
        }
        const qualityTermControl = event.target.closest(&#x27;[data-quality-term]&#x27;);
        if (qualityTermControl) {
          if (!root.querySelector(&#x27;#mf-final-result&#x27;).hidden) generateFinalPlan();
          return;
        }
        const extraTermControl = event.target.closest(&#x27;[data-extra-term]&#x27;);
        if (extraTermControl) {
          if (!root.querySelector(&#x27;#mf-final-result&#x27;).hidden) generateFinalPlan();
          return;
        }
        if (event.target.closest(&#x27;#mf-final-politics, input[name=&quot;mf-final-practice&quot;]&#x27;)) {
          if (!root.querySelector(&#x27;#mf-final-result&#x27;).hidden) generateFinalPlan();
          return;
        }
        const qualityCheckbox = event.target.closest(&#x27;[data-quality]&#x27;);
        if (qualityCheckbox) {
          root.querySelector(`[data-quality-term=&quot;${qualityCheckbox.dataset.quality}&quot;]`).disabled = !qualityCheckbox.checked;
          if (!root.querySelector(&#x27;#mf-final-result&#x27;).hidden) generateFinalPlan();
          return;
        }
        const checkbox = event.target.closest(&#x27;[data-extra]&#x27;);
        if (!checkbox) return;
        const termControl = root.querySelector(`[data-extra-term=&quot;${checkbox.dataset.extra}&quot;]`);
        if (termControl) termControl.disabled = !checkbox.checked;
        if (!root.querySelector(&#x27;#mf-final-result&#x27;).hidden) generateFinalPlan();
      });

      const rerenderScheduleForBreakpoint = () =&gt; {
        if (currentFinalView === &#x27;week&#x27; &amp;&amp; !root.querySelector(&#x27;#mf-final-result&#x27;).hidden) renderWeekSchedule();
      };
      if (mobileScheduleMedia.addEventListener) mobileScheduleMedia.addEventListener(&#x27;change&#x27;, rerenderScheduleForBreakpoint);
      else mobileScheduleMedia.addListener(rerenderScheduleForBreakpoint);

      render(plans[0]);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
